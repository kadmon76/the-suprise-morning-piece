<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Written Before</title>
<style>
:root{--bg:#0b0a0c;--fg:#e8e2d6;--dim:#7d776c;--amber:#ffb347;--blue:#4f8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:manipulation}
a.back{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;color:var(--dim);font:13px/1 system-ui,sans-serif;text-decoration:none;z-index:5}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:56px 18px max(22px,env(safe-area-inset-bottom))}
#top{text-align:center;min-height:120px;width:100%;max-width:420px}
#line{font-size:20px;line-height:1.35;min-height:54px}
#card{margin:14px auto 0;width:210px;height:74px;border:1px solid var(--dim);border-radius:6px;display:flex;align-items:center;justify-content:center;font:13px/1.3 ui-monospace,monospace;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;transition:border-color .3s,color .3s}
#card.open{color:var(--fg);border-color:var(--fg)}
#card.l{color:var(--amber);border-color:var(--amber)}#card.r{color:var(--blue);border-color:var(--blue)}
#pads{display:flex;gap:14px;width:100%;max-width:420px;height:46vh;max-height:380px}
.pad{flex:1;border:0;border-radius:14px;font:15px system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#120d05;cursor:pointer;opacity:.92}
.pad:active{opacity:1;transform:scale(.985)}
#L{background:var(--amber);box-shadow:0 0 60px #ffb34733}#R{background:var(--blue);box-shadow:0 0 60px #4f8cff33;color:#05091a}
#foot{font:12px system-ui,sans-serif;color:var(--dim);letter-spacing:.1em;min-height:16px}
#end{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;text-align:center;overflow:auto}
#end.on{display:flex}
#end p{max-width:360px;line-height:1.5;font-size:18px;margin:10px 0}
#end small{color:var(--dim);font:13px/1.5 system-ui,sans-serif;max-width:340px}
#strip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:300px;margin:14px 0}
.d{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dim)}
.d.h{background:var(--fg);border-color:var(--fg)}
.d.lie{outline:1.5px solid var(--amber);outline-offset:2px}
.gap{width:100%;height:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.pad:active{transform:none}}
</style></head><body>
<a class="back" href="../../index.html">← cue sheet</a>
<main>
<div id="top"><div id="line">Pick a side.</div><div id="card">sealed</div></div>
<div id="pads"><button class="pad" id="L">Left</button><button class="pad" id="R">Right</button></div>
<div id="foot"></div>
</main>
<div id="end"><div id="strip"></div><p id="t1"></p><p id="t2"></p><small id="t3"></small></div>
<script>
(function(){
const P1=16,TOT=24;
let hist=[],rounds=[],round=0,busy=false,shown=null,lastDef=[];
const $=id=>document.getElementById(id);
const name=v=>v?'right':'left';
function guess(){
  const n=hist.length;
  const tryCtx=k=>{
    if(n<k)return null;
    let c=[0,0];
    for(let i=k;i<n;i++){let m=true;for(let j=1;j<=k;j++)if(hist[i-j]!==hist[n-j]){m=false;break}
      if(m)c[hist[i]]++}
    if(c[0]===c[1])return null;
    return c[1]>c[0]?1:0;
  };
  let g=tryCtx(2);if(g===null)g=tryCtx(1);
  if(g===null&&n){let s=hist.reduce((a,b)=>a+b,0);if(s*2!==n)g=s*2>n?1:0}
  if(g===null)g=Math.random()<.5?1:0;
  return g;
}
function next(){
  busy=false;
  const c=$('card');c.className='';
  $('foot').textContent=String(round+1).padStart(2,'0')+' / '+TOT;
  if(round<P1){
    c.textContent='sealed';$('line').textContent=round===0?'Pick a side.':'Again.';
    c.dataset.g=guess();shown=null;
  }else{
    const g=guess();let p=g,lie=false;
    if(lastDef.length>=2&&lastDef[lastDef.length-1]&&lastDef[lastDef.length-2]){p=1-g;lie=true}
    c.dataset.g=g;c.dataset.p=p;c.dataset.lie=lie?1:0;shown=p;
    c.textContent='you will pick '+name(p);c.className='open '+(p?'r':'l');
    $('line').textContent=round===P1?'From here it tells you first.':'Go on.';
  }
}
function pick(v){
  if(busy)return;busy=true;
  const c=$('card');const g=+c.dataset.g;
  const hit=(g===v);
  let lie=false,def=false;
  if(round<P1){
    c.textContent='it wrote: '+name(g);c.className='open '+(g?'r':'l');
  }else{
    lie=c.dataset.lie==='1';def=(v!==shown);lastDef.push(def);
    c.textContent=def?'you broke it':'you obeyed';
  }
  rounds.push({hit,lie,phase:round<P1?1:2,def});
  hist.push(v);round++;
  $('line').textContent=hit?'Written.':'Missed.';
  setTimeout(()=>{round>=TOT?end():next()},round===P1?1100:(rounds[round-1].phase===1?850:1000));
}
function end(){
  const a=rounds.filter(r=>r.phase===1),b=rounds.filter(r=>r.phase===2);
  const ha=a.filter(r=>r.hit).length,hb=b.filter(r=>r.hit).length;
  const defs=b.filter(r=>r.def).length,lies=b.filter(r=>r.lie).length;
  const s=$('strip');s.innerHTML='';
  rounds.forEach((r,i)=>{
    if(i===P1){const g=document.createElement('div');g.className='gap';s.appendChild(g)}
    const d=document.createElement('div');d.className='d'+(r.hit?' h':'')+(r.lie?' lie':'');s.appendChild(d)
  });
  $('t1').textContent='Sealed, it read you '+ha+' times in '+P1+'. Coin flips manage 8.';
  let m;
  if(defs>=b.length-1)m='Then you told it no, nearly every time, and kept being right about yourself. Twice in a row of that and it started lying to you — the ringed dots. '+lies+' of them. '+hb+' of '+b.length+' still landed.';
  else if(defs===0)m='You did what it said, every time. It scored '+hb+' of '+b.length+'. Nothing was taken from you; it only had to ask.';
  else m='You broke its word '+defs+' times of '+b.length+'. It scored '+hb+'. '+(lies?'It lied to you '+lies+' time'+(lies>1?'s':'')+' — the ringed dots.':'It never needed to lie.');
  $('t2').textContent=m;
  $('t3').textContent='The guesses were four lines of counting over your last two picks. Nothing else was read — not the camera, not the clock.';
  $('end').classList.add('on');
}
$('L').addEventListener('click',()=>pick(0));
$('R').addEventListener('click',()=>pick(1));
next();
})();
</script></body></html>
