<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hold, Both</title>
<style>
  :root{
    --bg:#0a0908;
    --gold:#d9a94a;
    --gold-dim:#7a6335;
    --paper:#e8e2d2;
    --paper-dim:#867e6a;
    --panel:#14120d;
    --panel-edge:#332c1e;
    --card:#1b1812;
    --card-edge:#413824;
    --rust:#a84632;
    --ice:#7fb8d6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg); color:var(--paper);
    font-family:Georgia,'Times New Roman',serif;
    -webkit-user-select:none; user-select:none;
  }
  .stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    background:
      radial-gradient(ellipse 60% 26% at 50% 6%, rgba(217,169,74,0.06), transparent 62%),
      var(--bg);
    gap:14px;
  }

  .heading{ text-align:center; }
  .heading .kicker{
    font-size:10.5px; letter-spacing:0.2em; color:var(--gold-dim); text-transform:uppercase;
  }
  .heading .instr{
    font-size:12.5px; color:var(--paper-dim); margin-top:9px; letter-spacing:0.01em; font-style:italic;
    max-width:280px; margin-left:auto; margin-right:auto;
  }

  .marquee{
    width:100%; max-width:360px; text-align:center; min-height:2.2em;
    display:flex; align-items:center; justify-content:center;
    font-size:13.5px; color:var(--gold); letter-spacing:0.01em; line-height:1.4;
  }
  .marquee.trans{ transition:opacity 0.18s ease; }
  .marquee.dim{ opacity:0; }

  .rails{
    flex:1; min-height:0; width:100%; max-width:380px;
    display:flex; flex-direction:column; justify-content:center; gap:26px;
    position:relative;
  }
  .lane{ display:flex; align-items:center; gap:10px; }
  .lane .tag{
    width:16px; height:16px; border-radius:3px; border:1px solid var(--card-edge);
    display:flex; align-items:center; justify-content:center;
    font-size:9.5px; color:var(--paper-dim); flex-shrink:0;
  }
  .lane .track{
    position:relative; flex:1; height:2px; background:var(--panel-edge);
    border-radius:1px;
  }
  .lane .dot{
    position:absolute; top:50%; width:15px; height:15px; border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%, #fff6d8, var(--gold) 55%, var(--gold-dim) 100%);
    box-shadow:0 0 10px 3px rgba(217,169,74,0.4);
  }
  .lane .dot.trans{ transition:left 0s linear; }
  .lane .dot.cleared{
    background:radial-gradient(circle at 35% 30%, #3a3830, #222018 60%, #17150f 100%);
    box-shadow:none;
  }
  .lane .state{
    width:44px; flex-shrink:0; text-align:right;
    font-size:9px; letter-spacing:0.08em; color:var(--paper-dim); text-transform:uppercase;
  }
  .wings{
    position:absolute; top:-10px; bottom:-10px; left:92%;
    border-left:1px dashed rgba(232,226,210,0.22);
  }
  .wings .lbl{
    position:absolute; top:-16px; left:-14px; font-size:8.5px; letter-spacing:0.12em;
    color:var(--paper-dim); text-transform:uppercase; opacity:0.5;
  }

  .rope-wrap{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .rope{
    width:118px; height:118px; border-radius:50%;
    background:var(--card); border:1px solid var(--card-edge);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--paper-dim);
    touch-action:none;
  }
  .rope.trans{ transition:background 0.12s ease, box-shadow 0.12s ease, color 0.12s ease; }
  .rope.held{
    background:radial-gradient(circle at 35% 30%,#f4d98a,var(--gold) 60%,var(--gold-dim) 100%);
    box-shadow:0 0 22px 6px rgba(217,169,74,0.35);
    color:#221c10;
  }

  .back{
    position:fixed; left:calc(14px + env(safe-area-inset-left)); bottom:calc(12px + env(safe-area-inset-bottom));
    font-size:11px; color:var(--paper-dim); text-decoration:none; letter-spacing:0.02em;
    opacity:0.55; font-family:Georgia,serif;
  }
  .log-mark{
    position:fixed; right:calc(14px + env(safe-area-inset-right)); bottom:calc(12px + env(safe-area-inset-bottom));
    font-size:10.5px; letter-spacing:0.1em; color:var(--paper-dim); text-transform:uppercase;
    background:none; border:1px solid var(--card-edge); border-radius:3px;
    padding:6px 10px; opacity:0.6; font-family:Georgia,serif;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(6,5,3,0.92);
    display:flex; align-items:center; justify-content:center;
    padding:24px; opacity:0; pointer-events:none;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .overlay.fade{ transition:opacity 0.25s ease; }
  .sheet{
    width:100%; max-width:340px; border:1px solid var(--card-edge); background:var(--panel);
    border-radius:6px; padding:22px 20px;
  }
  .sheet h2{
    margin:0 0 14px; font-size:13px; letter-spacing:0.16em; color:var(--gold-dim); text-transform:uppercase; font-weight:600;
  }
  .sheet .row{
    display:flex; justify-content:space-between; gap:12px; font-size:12.5px; padding:6px 0;
    border-bottom:1px solid rgba(65,56,36,0.4); color:var(--paper-dim);
  }
  .sheet .row span:last-child{ color:var(--paper); text-align:right; }
  .sheet .confession{
    margin-top:14px; font-size:12px; line-height:1.55; color:var(--paper-dim); font-style:italic;
  }
  .sheet .close{
    margin-top:18px; width:100%; padding:10px; background:none; border:1px solid var(--card-edge);
    color:var(--paper-dim); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; border-radius:4px;
    font-family:Georgia,serif;
  }

  @media (prefers-reduced-motion: reduce){
    .marquee.trans, .rope.trans, .overlay.fade{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="heading">
    <div class="kicker">Backstage — The Rail</div>
    <div class="instr">Hold the rope to call HOLD.</div>
  </div>

  <div class="marquee trans" id="marquee">Running.</div>

  <div class="rails">
    <div class="wings" style="height:100%;"><span class="lbl">wings</span></div>
    <div class="lane">
      <div class="tag">A</div>
      <div class="track"><div class="dot" id="dotA" style="left:0%"></div></div>
      <div class="state" id="stateA">—</div>
    </div>
    <div class="lane">
      <div class="tag">B</div>
      <div class="track"><div class="dot" id="dotB" style="left:0%"></div></div>
      <div class="state" id="stateB">—</div>
    </div>
  </div>

  <div class="rope-wrap">
    <div class="rope trans" id="rope">Hold</div>
  </div>

  <a class="back" href="../../index.html">← cue sheet</a>
  <button class="log-mark" id="logMark" type="button">Call Sheet</button>
</div>

<div class="overlay fade" id="overlay">
  <div class="sheet">
    <h2>Call Sheet</h2>
    <div class="row"><span>Holds called</span><span id="rHolds">0</span></div>
    <div class="row"><span>Total hold time</span><span id="rHoldTime">0.0s</span></div>
    <div class="row"><span>A moved while held</span><span id="rAMoved">0.0%</span></div>
    <div class="row"><span>B moved while held</span><span id="rBMoved">0.0%</span></div>
    <div class="row"><span>B's arrival, delayed by</span><span id="rDelay">0.0s</span></div>
    <div class="confession" id="rConfession">Nothing's been called yet. A is already on its way regardless.</div>
    <button class="close" id="closeLog" type="button">Close</button>
  </div>
</div>

<script>
(function(){
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var POS0_A = 60;   // % along rail at load
  var POS0_B = 15;
  var V = 1.55;       // % per second, true speed for both when actually running

  var startTime = performance.now();
  var holding = false;
  var holdStartTime = null;
  var totalHoldTime = 0;   // ms, committed (completed holds only)
  var holdsCalled = 0;
  var frozenA = POS0_A;
  var clearedA = false, clearedB = false;

  var dotA = document.getElementById('dotA');
  var dotB = document.getElementById('dotB');
  var stateA = document.getElementById('stateA');
  var stateB = document.getElementById('stateB');
  var marquee = document.getElementById('marquee');
  var rope = document.getElementById('rope');

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function trueAAt(nowMs){
    var elapsedSec = (nowMs - startTime) / 1000;
    return clamp(POS0_A + V * elapsedSec, 0, 100);
  }

  function currentHoldMs(nowMs){
    if (!holding) return 0;
    return nowMs - holdStartTime;
  }

  function trueBAt(nowMs){
    var elapsedSec = (nowMs - startTime) / 1000;
    var pausedSec = (totalHoldTime + currentHoldMs(nowMs)) / 1000;
    var activeSec = Math.max(0, elapsedSec - pausedSec);
    return clamp(POS0_B + V * activeSec, 0, 100);
  }

  function setMarquee(text){
    marquee.classList.add('dim');
    var apply = function(){ marquee.textContent = text; marquee.classList.remove('dim'); };
    if (reduced){ apply(); } else { setTimeout(apply, 90); }
  }

  function render(){
    var now = performance.now();
    var trueA = trueAAt(now);
    var trueB = trueBAt(now);
    var displayA = holding ? frozenA : trueA;
    var displayB = trueB;

    dotA.style.left = displayA + '%';
    dotB.style.left = displayB + '%';

    // A's held tell: while frozen on screen, glow warmer the longer it's secretly still moving
    if (holding && !clearedA){
      var heat = clamp(currentHoldMs(now) / 4000, 0, 1);
      dotA.style.boxShadow = '0 0 ' + (10 + heat * 18) + 'px ' + (3 + heat * 4) + 'px rgba(255,236,180,' + (0.4 + heat * 0.5) + ')';
    } else if (!clearedA){
      dotA.style.boxShadow = '0 0 10px 3px rgba(217,169,74,0.4)';
    }
    if (holding && !clearedB){
      dotB.style.boxShadow = '0 0 6px 2px rgba(127,184,214,0.35)';
    } else if (!clearedB){
      dotB.style.boxShadow = '0 0 10px 3px rgba(217,169,74,0.4)';
    }

    if (trueA >= 100 && !clearedA){
      clearedA = true;
      dotA.classList.add('cleared');
      dotA.style.boxShadow = 'none';
      stateA.textContent = 'CLEAR';
    } else if (!clearedA){
      stateA.textContent = holding ? 'HOLD' : 'running';
    }

    if (trueB >= 100 && !clearedB){
      clearedB = true;
      dotB.classList.add('cleared');
      dotB.style.boxShadow = 'none';
      stateB.textContent = 'CLEAR';
    } else if (!clearedB){
      stateB.textContent = holding ? 'HOLD' : 'running';
    }

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  function startHold(){
    if (holding) return;
    holding = true;
    holdsCalled++;
    holdStartTime = performance.now();
    frozenA = trueAAt(holdStartTime);
    rope.classList.add('held');
    setMarquee('HOLD CALLED — BOTH HOLDING.');
  }

  function endHold(){
    if (!holding) return;
    var now = performance.now();
    totalHoldTime += (now - holdStartTime);
    holding = false;
    holdStartTime = null;
    rope.classList.remove('held');
    setMarquee('Running.');
  }

  rope.addEventListener('pointerdown', function(e){
    e.preventDefault();
    try { rope.setPointerCapture(e.pointerId); } catch(err){}
    startHold();
  });
  rope.addEventListener('pointerup', endHold);
  rope.addEventListener('pointercancel', endHold);
  rope.addEventListener('pointerleave', function(){ if (holding) endHold(); });

  // Call Sheet
  var logMark = document.getElementById('logMark');
  var overlay = document.getElementById('overlay');
  var closeLog = document.getElementById('closeLog');
  var rHolds = document.getElementById('rHolds');
  var rHoldTime = document.getElementById('rHoldTime');
  var rAMoved = document.getElementById('rAMoved');
  var rBMoved = document.getElementById('rBMoved');
  var rDelay = document.getElementById('rDelay');
  var rConfession = document.getElementById('rConfession');

  function renderLog(){
    var now = performance.now();
    var effectiveHoldMs = totalHoldTime + currentHoldMs(now);
    var holdSec = effectiveHoldMs / 1000;
    rHolds.textContent = holdsCalled;
    rHoldTime.textContent = holdSec.toFixed(1) + 's';
    rAMoved.textContent = (V * holdSec).toFixed(1) + '%';
    rBMoved.textContent = '0.0%';
    rDelay.textContent = holdSec.toFixed(1) + 's';

    if (holdsCalled === 0){
      rConfession.textContent = "Nothing's been called yet. A is already on its way regardless.";
    } else {
      rConfession.textContent = "Every hold read the same on both lamps. Only B's clock actually stopped. A's arrival was fixed before the rope was ever touched — every second called has only ever been spent by B.";
    }
  }

  logMark.addEventListener('click', function(){
    renderLog();
    overlay.classList.add('open');
  });
  closeLog.addEventListener('click', function(){
    overlay.classList.remove('open');
  });
  overlay.addEventListener('click', function(e){
    if (e.target === overlay) overlay.classList.remove('open');
  });
})();
</script>
</body>
</html>
