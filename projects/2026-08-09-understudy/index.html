<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<title>Understudy · The Surprise Morning Piece</title>
<style>
  * { box-sizing: border-box; }
  html,body{margin:0;height:100%;background:#08080b;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;}
  body{font-family:Georgia,'Times New Roman',serif;color:#e9dfce}

  canvas{position:fixed;inset:0;display:block}

  a.back{
    position:fixed;top:14px;left:14px;z-index:9;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:#7c7264;text-decoration:none;
    padding:6px 10px;border:1px solid rgba(233,223,206,.14);border-radius:99px;
    background:rgba(7,7,10,.5);backdrop-filter:blur(4px);
  }

  .mark{
    position:fixed;bottom:14px;right:14px;z-index:9;
    width:30px;height:30px;border-radius:50%;
    border:1px solid rgba(233,223,206,.14);background:rgba(7,7,10,.5);
    color:#5c5448;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);
  }

  .dots{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9;
    display:flex;gap:5px}
  .dots i{width:5px;height:5px;border-radius:50%;background:rgba(233,223,206,.14);display:block}
  .dots i.you{background:#f0cf9a}
  .dots i.understudy{background:#9ec4e8}

  .label{position:fixed;left:0;right:0;bottom:19%;z-index:5;text-align:center;
    font-style:italic;letter-spacing:.03em;font-size:15px;color:#7c7264;
    min-height:1.4em;opacity:0;transition:opacity .5s ease, color .4s ease;
    pointer-events:none}
  .label.show{opacity:1}
  .label.you{color:#f0cf9a}
  .label.understudy{color:#9ec4e8}

  .drawer{position:fixed;left:0;right:0;bottom:0;z-index:10;
    background:rgba(10,10,13,.96);border-top:1px solid rgba(233,223,206,.14);
    padding:18px 20px 26px;transform:translateY(100%);transition:transform .35s ease;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#a89e8c;line-height:1.9}
  .drawer.open{transform:translateY(0)}
  .drawer .h{color:#5c5448;text-transform:uppercase;letter-spacing:.16em;font-size:10px;margin-bottom:8px}
  .drawer .v{color:#c9bda3;font-variant-numeric:tabular-nums}
  .drawer .line{font-style:italic;color:#7c7264;margin-top:10px;font-family:Georgia,serif;font-size:12.5px}

  @media (prefers-reduced-motion: reduce){
    .label,.drawer{transition:none}
  }
</style>
</head>
<body>
<a class="back" href="../../index.html">&larr; cue sheet</a>
<div class="mark" id="mark">&#9679;</div>
<div class="dots" id="dots"></div>
<div class="label" id="label"></div>
<canvas id="stage"></canvas>

<div class="drawer" id="drawer">
  <div class="h">call sheet</div>
  <div>wraps tied &middot; you &middot; <span class="v" id="dYou">&mdash;</span></div>
  <div>wraps tied &middot; understudy &middot; <span class="v" id="dGhost">&mdash;</span></div>
  <div>match &middot; <span class="v" id="dConf">&mdash;</span></div>
  <div class="line">The tag only asks if it's set. Not whose hand tied the last one.</div>
</div>

<script>
(function(){
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var label = document.getElementById('label');
  var dotsEl = document.getElementById('dots');
  var mark = document.getElementById('mark');
  var drawer = document.getElementById('drawer');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CAP = 7;
  var BUCKETS = 16;
  var ARMED_HUMAN_MIN = 3;
  var ARMED_CONF_MIN = 0.4;
  var IDLE_DELAY = 1100;
  var TWO_PI = Math.PI * 2;

  var W, H, DPR, cx, cy, R, bandLow, bandHigh;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cx = W/2; cy = H*0.46;
    R = Math.max(56, Math.min(120, Math.min(W,H) * 0.15));
    bandLow = R * 0.5; bandHigh = R * 1.8;
  }
  window.addEventListener('resize', resize);
  resize();

  for (var i=0;i<CAP;i++){ var d=document.createElement('i'); dotsEl.appendChild(d); }
  function paintDots(){
    var items = dotsEl.children;
    for (var i=0;i<CAP;i++){
      items[i].className = '';
      if (wraps[i]) items[i].className = wraps[i].source;
    }
  }

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function angleDiff(a,b){ var d=a-b; while(d>Math.PI) d-=TWO_PI; while(d<-Math.PI) d+=TWO_PI; return d; }
  function now(){ return performance.now(); }
  function freshBuckets(){
    var b = [];
    for (var i=0;i<BUCKETS;i++) b.push({rSum:0,dtSum:0,n:0});
    return b;
  }

  var wraps = [];               // {source:'you'|'understudy', buckets}
  var progressAngle = 0;
  var dirSign = 0;
  var lastAngle = null, lastSampleT = 0;
  var curBuckets = freshBuckets();
  var recordedProfile = null;   // [{r,dt}] length BUCKETS
  var confidence = 0;
  var humanWraps = 0, ghostWraps = 0;
  var pointerDown = false;
  var ghostRunning = false, ghostRAF = null, ghostChainTimer = null, idleTimer = null;
  var ghostStartProgress = 0, ghostStartT = 0, ghostDuration = 1400;
  var done = false, doneAt = 0;
  var labelTimer = null;

  function setLabel(text, cls){
    clearTimeout(labelTimer);
    label.textContent = text;
    label.className = 'label' + (cls ? ' show '+cls : (text ? ' show' : ''));
  }
  function flashLabel(text, cls, ms){
    setLabel(text, cls);
    labelTimer = setTimeout(function(){ label.className = 'label'; }, ms || 900);
  }

  function armed(){
    return !done && humanWraps >= ARMED_HUMAN_MIN && confidence >= ARMED_CONF_MIN && wraps.length < CAP && recordedProfile;
  }

  function clearIdleTimer(){ if (idleTimer){ clearTimeout(idleTimer); idleTimer = null; } }
  function scheduleIdleCheck(){
    clearIdleTimer();
    if (done || pointerDown || ghostRunning) return;
    idleTimer = setTimeout(function(){
      if (!pointerDown && !ghostRunning && armed()) startGhostWrap();
    }, IDLE_DELAY);
  }

  function bucketOf(p){ return clamp(Math.floor((p % TWO_PI) / (TWO_PI/BUCKETS)), 0, BUCKETS-1); }

  function recordSample(p, radius, t){
    var idx = bucketOf(p);
    var b = curBuckets[idx];
    b.rSum += radius; b.n++;
    if (lastSampleT) b.dtSum += Math.max(0, t - lastSampleT);
    lastSampleT = t;
  }

  function updateProfile(buckets, isGhost){
    var avgR = [], avgDt = [];
    for (var i=0;i<BUCKETS;i++){
      var b = buckets[i];
      avgR[i] = b.n ? b.rSum/b.n : R;
      avgDt[i] = b.n ? b.dtSum/Math.max(1,b.n-1) : 40;
    }
    if (!recordedProfile){
      recordedProfile = [];
      for (i=0;i<BUCKETS;i++) recordedProfile.push({r:avgR[i], dt:avgDt[i]});
      return;
    }
    if (isGhost){
      confidence = clamp(confidence + 0.03, 0, 0.95);
      return;
    }
    var devSum = 0, devN = 0;
    for (i=0;i<BUCKETS;i++){
      if (!buckets[i].n) continue;
      var relR = Math.abs(avgR[i]-recordedProfile[i].r) / Math.max(recordedProfile[i].r, 1);
      var relDt = Math.abs(avgDt[i]-recordedProfile[i].dt) / Math.max(recordedProfile[i].dt, 1);
      devSum += (relR + relDt) / 2; devN++;
    }
    var devScore = devN ? devSum/devN : 0.5;
    var consistency = clamp(1 - devScore, 0, 1);
    confidence = (humanWraps <= 1) ? consistency : clamp(confidence*0.6 + consistency*0.4, 0, 1);
    if (devScore > 0.9) confidence = confidence * 0.5;
    for (i=0;i<BUCKETS;i++){
      if (!buckets[i].n) continue;
      recordedProfile[i].r = recordedProfile[i].r*0.7 + avgR[i]*0.3;
      recordedProfile[i].dt = recordedProfile[i].dt*0.7 + avgDt[i]*0.3;
    }
  }

  function completeWrap(source){
    wraps.push({ source: source, buckets: curBuckets });
    if (source === 'you') humanWraps++; else ghostWraps++;
    updateProfile(curBuckets, source === 'understudy');
    curBuckets = freshBuckets();
    paintDots();
    if (wraps.length >= CAP) finishSet();
  }

  function undoWrap(){
    if (!wraps.length) return;
    var last = wraps.pop();
    if (last.source === 'you'){ humanWraps--; confidence *= 0.9; flashLabel('loose again.', 'you', 700); }
    else { ghostWraps--; confidence *= 0.5; flashLabel('taken back.', 'you', 900); }
    paintDots();
  }

  function finishSet(){
    done = true; doneAt = now();
    stopGhost();
    setLabel('set.');
  }

  function restage(){
    wraps = []; progressAngle = 0; dirSign = 0; lastAngle = null;
    curBuckets = freshBuckets(); recordedProfile = null; confidence = 0;
    humanWraps = 0; ghostWraps = 0; done = false;
    paintDots();
    setLabel('');
  }

  function stopGhost(){
    ghostRunning = false;
    if (ghostRAF) cancelAnimationFrame(ghostRAF);
    if (ghostChainTimer) clearTimeout(ghostChainTimer);
    ghostRAF = null; ghostChainTimer = null;
  }

  function startGhostWrap(){
    if (done || wraps.length >= CAP || !armed()) return;
    ghostRunning = true;
    ghostStartProgress = progressAngle;
    ghostStartT = now();
    var totalDt = 0;
    for (var i=0;i<BUCKETS;i++) totalDt += recordedProfile[i].dt;
    ghostDuration = clamp(totalDt * (1 - confidence*0.2), 550, 3400);
    curBuckets = freshBuckets();
    setLabel("it's got it.", 'understudy');
    if (reduced){
      progressAngle = TWO_PI;
      for (i=0;i<BUCKETS;i++) curBuckets[i] = { rSum: recordedProfile[i].r, dtSum: recordedProfile[i].dt, n: 1 };
      completeWrap('understudy');
      progressAngle = 0;
      ghostRunning = false;
      if (wraps.length < CAP) ghostChainTimer = setTimeout(function(){ if(!pointerDown) startGhostWrap(); }, 500);
      return;
    }
    step();
    function step(){
      if (!ghostRunning) return;
      var t = now();
      var frac = clamp((t-ghostStartT)/ghostDuration, 0, 1);
      progressAngle = ghostStartProgress + frac*(TWO_PI-ghostStartProgress);
      var idx = bucketOf(progressAngle);
      var b = curBuckets[idx];
      var rad = recordedProfile[idx].r;
      b.rSum += rad; b.n++; b.dtSum += 16;
      if (frac >= 1){
        ghostRunning = false;
        completeWrap('understudy');
        progressAngle = 0;
        if (wraps.length < CAP){
          ghostChainTimer = setTimeout(function(){ if(!pointerDown) startGhostWrap(); }, 350);
        } else {
          setLabel('');
        }
        return;
      }
      ghostRAF = requestAnimationFrame(step);
    }
  }

  function onDown(x,y){
    if (done){
      if (now() - doneAt > 900) restage();
      return;
    }
    if (ghostRunning){
      stopGhost();
      progressAngle = 0;
      curBuckets = freshBuckets();
      flashLabel('yours again.', 'you', 800);
      confidence *= 0.85;
    }
    clearIdleTimer();
    pointerDown = true;
    lastAngle = null; lastSampleT = 0;
  }

  function onMove(x,y){
    if (!pointerDown || done) return;
    var ang = Math.atan2(y-cy, x-cx);
    var radius = Math.hypot(x-cx, y-cy);
    var t = now();
    if (lastAngle !== null && radius >= bandLow && radius <= bandHigh){
      var d = angleDiff(ang, lastAngle);
      if (dirSign === 0 && Math.abs(d) > 0.01) dirSign = d >= 0 ? 1 : -1;
      var delta = d * (dirSign || 1);
      progressAngle += delta;
      recordSample(clamp(progressAngle,0,TWO_PI*4), radius, t);
      var guard = 0;
      while (progressAngle >= TWO_PI && guard++ < 8){
        completeWrap('you');
        progressAngle -= TWO_PI;
        lastSampleT = 0;
      }
      while (progressAngle < 0 && guard++ < 8){
        if (!wraps.length){ progressAngle = 0; break; }
        undoWrap();
        progressAngle += TWO_PI;
        lastSampleT = 0;
      }
      if (wraps.length >= CAP){ progressAngle = clamp(progressAngle,0,TWO_PI); }
    }
    lastAngle = ang;
  }

  function onUp(){
    if (!pointerDown) return;
    pointerDown = false;
    lastAngle = null;
    if (!done) setLabel('');
    scheduleIdleCheck();
  }

  document.addEventListener('pointerdown', function(e){
    if (e.target === mark || mark.contains(e.target)) return;
    if (e.cancelable) e.preventDefault();
    onDown(e.clientX, e.clientY);
  }, {passive:false});
  document.addEventListener('pointermove', function(e){
    if (e.cancelable && pointerDown) e.preventDefault();
    onMove(e.clientX, e.clientY);
  }, {passive:false});
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);

  mark.addEventListener('pointerdown', function(e){
    e.stopPropagation();
    drawer.classList.toggle('open');
    fillDrawer();
  });
  function fillDrawer(){
    document.getElementById('dYou').textContent = humanWraps;
    document.getElementById('dGhost').textContent = ghostWraps;
    document.getElementById('dConf').textContent = Math.round(confidence*100) + '%';
  }

  // ---- drawing ----
  function drawBackground(){
    ctx.clearRect(0,0,W,H);
    var g = ctx.createRadialGradient(cx, cy, R*0.4, cx, cy, Math.max(W,H)*0.75);
    g.addColorStop(0, '#151217');
    g.addColorStop(1, '#08080b');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, R*3.2);
    glow.addColorStop(0, 'rgba(240,207,154,0.10)');
    glow.addColorStop(1, 'rgba(240,207,154,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, R*3.2, 0, TWO_PI); ctx.fill();
  }

  function drawCleat(){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = '#1c1712';
    ctx.strokeStyle = 'rgba(233,223,206,.18)';
    ctx.lineWidth = 1;
    roundRect(-7, -R*0.55, 14, R*0.95, 5);
    ctx.fill(); ctx.stroke();
    roundRect(-R*0.42, -R*0.55, R*0.34, 13, 6); ctx.fill(); ctx.stroke();
    roundRect(R*0.08, -R*0.55, R*0.34, 13, 6); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function wrapColor(source, alpha){
    return source === 'you' ? 'rgba(240,207,154,'+alpha+')' : 'rgba(158,196,232,'+alpha+')';
  }

  function drawWrapArc(source, level, startA, endA){
    var rr = R * (0.72 + level*0.055);
    ctx.beginPath();
    ctx.strokeStyle = wrapColor(source, 0.85);
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.arc(cx, cy, rr, startA, endA);
    ctx.stroke();
    ctx.beginPath();
    ctx.strokeStyle = wrapColor(source, 0.35);
    ctx.lineWidth = 1.2;
    ctx.arc(cx, cy, rr - 2.2, startA, endA);
    ctx.stroke();
  }

  function draw(){
    drawBackground();
    for (var i=0;i<wraps.length;i++){
      drawWrapArc(wraps[i].source, i, 0, TWO_PI);
    }
    var liveLevel = wraps.length;
    if (liveLevel < CAP){
      if (pointerDown && progressAngle > 0.02){
        drawWrapArc('you', liveLevel, 0, progressAngle);
      } else if (ghostRunning && progressAngle > ghostStartProgress + 0.02){
        drawWrapArc('understudy', liveLevel, ghostStartProgress, progressAngle);
      }
    }
    drawCleat();
    if (done){
      ctx.save();
      ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = 'rgba(233,223,206,.55)';
      ctx.textAlign = 'center';
      ctx.fillText('SET', cx, cy + R*1.35);
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  draw();

  setLabel('feed the cleat.');
})();
</script>
</body>
</html>
