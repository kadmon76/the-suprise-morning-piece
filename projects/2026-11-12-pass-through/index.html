<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>(Pass Through.)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<style>
  *,*::before,*::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #060608; color: #d7d7df; font-family: Georgia, ui-serif, serif; }
  body { touch-action: manipulation; }
  .back { position: fixed; top: 10px; left: 12px; color: #4a4a55; font-size: 11px; font-family: ui-monospace, monospace; text-decoration: none; z-index: 20; letter-spacing: 0.04em; }
  .back:active, .back:hover { color: #8a8a95; }
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .terminal { flex: 1; position: relative; overflow: hidden; }

  .gate {
    position: absolute; top: 9%; left: 50%; transform: translateX(-50%);
    width: 68%; max-width: 300px; height: 96px;
    border: 1px solid #22222c; border-bottom: none;
    border-top-left-radius: 50% 42%; border-top-right-radius: 50% 42%;
    background: linear-gradient(to bottom, rgba(220,180,110,0.03), transparent);
    pointer-events: none;
  }
  .gate .line {
    position: absolute; bottom: -1px; left: -8%; right: -8%; height: 1px;
    background: linear-gradient(to right, transparent, #4a3a1e, transparent);
  }
  .gate .lintel {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.18em;
    color: #5a4a2e;
  }
  .gate.flash { animation: gateflash 320ms ease-out; }
  @keyframes gateflash {
    0% { background: rgba(220,180,110,0.22); }
    100% { background: linear-gradient(to bottom, rgba(220,180,110,0.03), transparent); }
  }

  .ripple { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(to bottom, rgba(220,180,110,0.09), transparent 28%, transparent 72%, rgba(220,180,110,0.05)); }
  .ripple.on { animation: ripple 420ms ease-out; }
  @keyframes ripple { 0%,100% { opacity: 0; } 25% { opacity: 1; } }

  .silhouette {
    position: absolute; left: 50%; width: 28px; height: 44px;
    transform: translate(-50%, 0); pointer-events: none;
    transition: opacity 500ms ease-out;
  }
  .silhouette .body {
    width: 28px; height: 44px; background: #0d0d14;
    border: 1px solid #1a1a22; border-radius: 13px 13px 3px 3px;
  }
  .silhouette .head {
    position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
    width: 15px; height: 15px; border-radius: 50%; background: #0d0d14;
    border: 1px solid #1a1a22;
  }
  .silhouette.me .body { border-color: #6a5030; box-shadow: 0 0 10px rgba(180,120,60,0.18); }
  .silhouette.me .head { border-color: #6a5030; }
  .silhouette.scanned { opacity: 0; }

  .hud {
    position: relative; padding: 14px 20px 22px;
    background: linear-gradient(to top, rgba(6,6,8,1) 60%, rgba(6,6,8,0.9), transparent);
    display: flex; flex-direction: column; gap: 14px;
  }
  .status { display: flex; justify-content: space-between; align-items: baseline;
    font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; color: #6a6a75; }
  .status .wait { color: #6a6a75; transition: color 200ms; }
  .status .wait.on { color: #c89660; }

  .optout {
    width: 100%; padding: 17px 16px; font-size: 11.5px; letter-spacing: 0.14em;
    background: #10101a; color: #d7d7df; border: 1px solid #22222c;
    font-family: ui-monospace, monospace; cursor: pointer;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    position: relative; overflow: hidden; text-align: center;
  }
  .optout.held { background: #2a1a0a; border-color: #4a3a1e; color: #e8c890; }
  .optout.done { opacity: 0.55; cursor: default; }
  .optout .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: #3a2a14;
    transition: width 80ms linear;
  }
  .optout .label { position: relative; z-index: 1; }

  .mark {
    position: fixed; top: 10px; right: 14px; background: none; border: none;
    color: #3a3a45; font-size: 18px; cursor: pointer; padding: 6px 10px; z-index: 20;
    line-height: 1; font-family: Georgia, serif;
  }
  .mark:hover, .mark:active { color: #8a8a95; }

  .ledger {
    position: fixed; inset: 0; background: rgba(6,6,8,0.98); padding: 36px 22px 28px;
    overflow-y: auto; display: none; z-index: 100;
  }
  .ledger.on { display: block; }
  .ledger h2 { font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.18em; color: #8a8a95; margin: 0 0 18px; font-weight: normal; }
  .ledger .log { font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.95; color: #7a7a85; white-space: pre; overflow-x: auto; margin-bottom: 20px; }
  .ledger .log .accent { color: #c89660; }
  .ledger .confession { color: #c89660; font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.95; border-top: 1px solid #22222c; padding-top: 18px; margin-bottom: 22px; }
  .ledger .close { background: none; border: 1px solid #22222c; color: #8a8a95; padding: 8px 14px;
    font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; cursor: pointer; }
  .ledger .close:active { background: #10101a; }

  @media (prefers-reduced-motion: reduce) {
    .silhouette, .gate, .ripple, .optout .fill, .silhouette.scanned {
      transition: none !important; animation: none !important;
    }
  }
</style>
</head>
<body>
<a href="../../index.html" class="back">← cue sheet</a>
<button class="mark" id="markBtn" aria-label="open gate entry log">⁎</button>

<div class="wrap">
  <div class="terminal" id="terminal">
    <div class="ripple" id="ripple"></div>
    <div class="gate" id="gate">
      <div class="lintel">GATE · DOMESTIC</div>
      <div class="line"></div>
    </div>
    <!-- silhouettes injected -->
  </div>
  <div class="hud">
    <div class="status">
      <div id="verified">VERIFIED  ·  0 / 8</div>
      <div id="wait" class="wait">+ 0.0 s</div>
    </div>
    <button class="optout" id="optout" aria-label="opt out of face scan (hold)">
      <div class="fill" id="fill"></div>
      <div class="label" id="oplabel">OPT OUT  ·  HOLD</div>
    </button>
  </div>
</div>

<div class="ledger" id="ledger" role="dialog" aria-label="gate entry log">
  <h2>GATE 7 · ENTRY LOG</h2>
  <div class="log" id="log"></div>
  <div class="confession" id="confession"></div>
  <button class="close" id="close">close</button>
</div>

<script>
(function(){
  'use strict';

  const GATE_Y = 20;        // percent from top
  const SPAWN_SPACING = 7.5; // percent between silhouettes at start
  const MIN_SPACING = 6;    // minimum visual spacing when stacking
  const SPEED = 6;          // percent per second
  const FORCED_HOLD = 6.5;  // seconds before opt-out gets acknowledged anyway
  const ME_INDEX = 3;       // 0 = frontmost in queue

  const terminal = document.getElementById('terminal');
  const verifiedEl = document.getElementById('verified');
  const waitEl = document.getElementById('wait');
  const gateEl = document.getElementById('gate');
  const rippleEl = document.getElementById('ripple');
  const optoutBtn = document.getElementById('optout');
  const fillEl = document.getElementById('fill');
  const labelEl = document.getElementById('oplabel');
  const ledgerEl = document.getElementById('ledger');
  const logEl = document.getElementById('log');
  const confessionEl = document.getElementById('confession');
  const markBtnEl = document.getElementById('markBtn');
  const closeEl = document.getElementById('close');

  const state = {
    silhouettes: [],
    verified: 0,
    holding: false,
    waitAdded: 0,
    totalHoldTime: 0,
    forced: false,
    done: false,
    startTime: 0,
    lastT: 0,
    rafId: 0,
    entries: [],
  };

  const now = () => (Date.now() - state.startTime) / 1000;
  function fmt(t) {
    const m = Math.floor(t / 60).toString().padStart(2, '0');
    const s = Math.floor(t % 60).toString().padStart(2, '0');
    const c = Math.floor((t * 100) % 100).toString().padStart(2, '0');
    return m + ':' + s + '.' + c;
  }
  function logEntry(text, accent) {
    state.entries.push({ t: now(), text: text, accent: !!accent });
  }
  function renderLog() {
    if (!state.entries.length) { logEl.textContent = ''; return; }
    const html = state.entries.map(function(e){
      const line = fmt(e.t) + '   ' + e.text;
      return e.accent ? '<span class="accent">' + line + '</span>' : line;
    }).join('\n');
    logEl.innerHTML = html;
  }

  function init() {
    state.startTime = Date.now();
    state.lastT = state.startTime;
    for (let i = 0; i < 8; i++) {
      const y = GATE_Y + 8 + i * SPAWN_SPACING;
      const isMe = (i === ME_INDEX);
      const el = document.createElement('div');
      el.className = 'silhouette' + (isMe ? ' me' : '');
      el.innerHTML = '<div class="head"></div><div class="body"></div>';
      el.style.top = y + '%';
      terminal.appendChild(el);
      state.silhouettes.push({
        id: i + 1,
        y: y,
        isMe: isMe,
        el: el,
        scanned: false,
        label: isMe ? 'you' : ('subject #' + (i + 1)),
      });
    }
    // The real scan. Barely visible.
    rippleEl.classList.add('on');
    setTimeout(function(){ rippleEl.classList.remove('on'); }, 500);
    logEntry('Queue opened. Face capture: 8 / 8 complete at entry.', true);
    renderLog();
  }

  function frame() {
    if (state.done) return;
    const t = Date.now();
    const dt = Math.min(0.1, (t - state.lastT) / 1000);
    state.lastT = t;

    // move silhouettes front-to-back
    const active = state.silhouettes.filter(function(s){ return !s.scanned; });
    active.sort(function(a, b){ return a.y - b.y; });
    let prevY = -Infinity;
    for (let k = 0; k < active.length; k++) {
      const s = active[k];
      let newY;
      if (s.isMe && state.holding && !state.forced) {
        newY = s.y; // frozen
      } else {
        const target = s.y - SPEED * dt;
        newY = (prevY === -Infinity) ? target : Math.max(target, prevY + MIN_SPACING);
      }
      s.y = newY;
      s.el.style.top = s.y + '%';
      prevY = s.y;
    }

    // scan front if at gate
    const front = active[0];
    if (front && front.y <= GATE_Y) {
      front.scanned = true;
      front.el.classList.add('scanned');
      state.verified += 1;
      gateEl.classList.remove('flash');
      // force reflow for repeat flashes
      void gateEl.offsetWidth;
      gateEl.classList.add('flash');
      verifiedEl.textContent = 'VERIFIED  ·  ' + state.verified + ' / 8';
      logEntry('Gate passage: ' + front.label + '.');
      renderLog();
      if (state.verified === 8) {
        end();
        return;
      }
    }

    // wait + hold accounting
    if (state.holding) {
      state.totalHoldTime += dt;
      state.waitAdded = state.totalHoldTime;
      waitEl.textContent = '+ ' + state.waitAdded.toFixed(1) + ' s';
      waitEl.classList.add('on');
      fillEl.style.width = Math.min(100, (state.totalHoldTime / FORCED_HOLD) * 100) + '%';
      if (state.totalHoldTime >= FORCED_HOLD && !state.forced) {
        state.forced = true;
        labelEl.textContent = 'OPT-OUT ACKNOWLEDGED';
        logEntry('Opt-out request received for you. Capture retained.', true);
        logEntry('No action required: subject already in log at 00:00.00.', true);
        renderLog();
      }
    } else {
      fillEl.style.width = '0';
    }

    state.rafId = requestAnimationFrame(frame);
  }

  function end() {
    state.done = true;
    cancelAnimationFrame(state.rafId);
    buildConfession();
    optoutBtn.classList.remove('held');
    optoutBtn.classList.add('done');
    optoutBtn.disabled = true;
    labelEl.textContent = state.forced ? 'ACKNOWLEDGED' : 'CLEARED';
    setTimeout(function(){ ledgerEl.classList.add('on'); }, 700);
  }

  function buildConfession() {
    const me = state.silhouettes.find(function(s){ return s.isMe; });
    const lines = [];
    lines.push('Gate passages logged tonight:  ' + state.verified + ' / 8.');
    lines.push('Entry captures logged at 00:00.00:  8 / 8.');
    lines.push('');
    if (state.forced) {
      lines.push('Your opt-out was recorded and acknowledged.');
      lines.push('It did not reach the capture.');
      lines.push('The capture was complete before the queue moved.');
    } else if (state.waitAdded > 0.4) {
      lines.push('You held for ' + state.waitAdded.toFixed(1) + ' seconds.');
      lines.push('That record is honest.');
      lines.push('The capture it meant to prevent was already on file.');
    } else {
      lines.push('You did not opt out tonight.');
      lines.push('It would not have mattered.');
      lines.push('The capture was complete before the queue moved.');
    }
    confessionEl.innerHTML = lines.map(function(l){ return l || '&nbsp;'; }).join('<br>');
  }

  // ---- input ----
  function onDown(e) {
    if (state.done) return;
    e.preventDefault();
    if (state.holding) return;
    state.holding = true;
    optoutBtn.classList.add('held');
    if (!state.forced) labelEl.textContent = 'HOLDING';
  }
  function onUp(e) {
    if (state.done) return;
    if (!state.holding) return;
    if (state.forced) { return; }
    if (e && e.preventDefault) e.preventDefault();
    state.holding = false;
    optoutBtn.classList.remove('held');
    labelEl.textContent = 'OPT OUT  ·  HOLD';
    logEntry('Opt-out released.');
    renderLog();
  }

  // pointer + touch fallbacks
  optoutBtn.addEventListener('pointerdown', onDown);
  optoutBtn.addEventListener('pointerup', onUp);
  optoutBtn.addEventListener('pointerleave', onUp);
  optoutBtn.addEventListener('pointercancel', onUp);
  // some older iOS surfaces: touchstart/touchend
  optoutBtn.addEventListener('touchstart', onDown, { passive: false });
  optoutBtn.addEventListener('touchend', onUp, { passive: false });

  markBtnEl.addEventListener('click', function(){
    renderLog();
    buildConfession();
    ledgerEl.classList.add('on');
  });
  closeEl.addEventListener('click', function(){
    ledgerEl.classList.remove('on');
  });

  init();
  state.rafId = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
