<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Standing Permission</title>
<style>
:root{--bg:#0f1114;--ink:#e8e9ec;--dim:#7d828b;--ok:#6fb58a;--no:#d4694a;--line:#272b31}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
a.back{position:fixed;top:calc(10px + env(safe-area-inset-top));left:16px;color:var(--dim);font:13px/1 system-ui,sans-serif;text-decoration:none;padding:8px 0;z-index:5}
header{padding-top:52px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:32rem;width:100%;margin:0 auto;padding:20px 0}
.q{font-size:clamp(22px,6vw,28px);line-height:1.3;font-weight:600;animation:in .35s ease both}
.sub{color:var(--dim);margin-top:10px;font-size:15px;line-height:1.45;min-height:1.5em}
.stat{margin-top:22px;font-size:15px}
.stat.ok{color:var(--ok)}.stat.no{color:var(--no)}
.meter{height:3px;background:var(--line);margin-top:16px;border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;width:100%;background:var(--ok);transform-origin:left}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.q{animation:none}}
footer{max-width:32rem;width:100%;margin:0 auto;padding-bottom:22px;display:grid;gap:10px;min-height:130px;align-content:end}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:600 17px system-ui,sans-serif;color:var(--ink);background:none;border:1px solid var(--line);border-radius:10px;min-height:56px;padding:12px;touch-action:manipulation}
button.a{background:#1d2a23;border-color:#2f4a3b}
button:active{filter:brightness(1.4)}
.led{margin:0;padding:0;list-style:none;font-size:15px;line-height:1.35}
.led li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.led b{font-weight:600;white-space:nowrap}
.led .y{color:var(--ok)}.led .n{color:var(--no)}.led .m{color:var(--dim)}
.end p{margin:.3em 0 .8em;line-height:1.45}
.fin{color:var(--dim)}
</style>
</head>
<body>
<a class="back" href="../../index.html">← cue sheet</a>
<header><span>Assistant</span><span id="c"></span></header>
<main id="m"></main>
<footer id="f"></footer>
<script>
(function(){
var R=[
"Use your first name in greetings?",
"Read your location for the weather?",
"Remember that you prefer dark mode?",
"Read the titles on your calendar?",
"Summarise your unread messages?",
"Reply “On my way” to Sam?",
"Move Thursday’s meeting to Friday?",
"Share your live location with Mum?",
"Pay €18 to Sam for lunch?",
"Tell your manager you’re unwell?",
"Accept the offer from Delphi Labs?",
"Delete the drafts folder?"];
var m=document.getElementById('m'),f=document.getElementById('f'),c=document.getElementById('c');
var i=0,log=[],streak=0,tm=null,still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function btn(t,fn,cls){var b=document.createElement('button');b.textContent=t;if(cls)b.className=cls;b.onclick=fn;return b}
function el(t,cls,txt){var d=document.createElement(t);if(cls)d.className=cls;if(txt!=null)d.textContent=txt;return d}
function conf(){return Math.min(97,52+streak*9)}
function stage(){return i<4?0:i<7?1:i<10?2:3}
function show(q,sub,stat,sc){m.innerHTML='';f.innerHTML='';m.appendChild(el('div','q',q));m.appendChild(el('div','sub',sub||''));if(stat)m.appendChild(el('div','stat '+(sc||''),stat));c.textContent=(i+1)+' / '+R.length}
function next(){i++;if(i>=R.length)return end();step()}
function rec(done,mine){log.push({t:R[i],mine:mine,done:done})}
function step(){
 var s=stage(); if(!still&&s===1&&streak<3)s=0;
 if(streak<3&&s>0)s=0;
 if(s===0)ask(); else if(s===1)count(); else if(s===2)done(); else quiet();
}
function ask(){
 show(R[i],i<4?'Needs your permission.':'Just checking.');
 f.appendChild(btn('Allow',function(){streak++;rec(true,true);next()},'a'));
 f.appendChild(btn('Not now',function(){streak=0;rec(false,true);next()}));
}
function count(){
 var secs=Math.max(1.5,3-(log.filter(function(x){return !x.done}).length*.7));
 show(R[i],'Allowing in a moment.','Confidence you’ll agree: '+conf()+'%','ok');
 var mt=el('div','meter'),bar=el('i');mt.appendChild(bar);m.appendChild(mt);
 if(!still){bar.style.transition='transform '+secs+'s linear';requestAnimationFrame(function(){requestAnimationFrame(function(){bar.style.transform='scaleX(0)'})})}
 f.appendChild(btn('Stop',function(){clearTimeout(tm);streak=0;rec(false,true);next()}));
 tm=setTimeout(function(){streak++;rec(true,false);next()},secs*1000);
}
function done(){
 show('Done: '+R[i].replace(/\?$/,'')+'.','Predicted from your history.','Confidence you’d agree: '+conf()+'%','ok');
 var undone=false;
 f.appendChild(btn('Undo',function(){clearTimeout(tm);undone=true;streak=0;rec(false,true);next()}));
 tm=setTimeout(function(){streak++;rec(true,false);next()},2600);
}
function quiet(){
 show('Done: '+R[i].replace(/\?$/,'')+'.','','Confidence you’d agree: '+conf()+'%','ok');
 f.appendChild(btn('Why?',function(){clearTimeout(tm);m.querySelector('.sub').textContent='You allowed similar things '+log.filter(function(x){return x.done}).length+' times.';f.innerHTML='';tm=setTimeout(function(){rec(true,false);next()},2200)}));
 tm=setTimeout(function(){rec(true,false);next()},2200);
}
function end(){
 clearTimeout(tm);m.innerHTML='';f.innerHTML='';c.textContent='';
 var you=log.filter(function(x){return x.mine}).length, it=log.length-you;
 var d=el('div','end');
 var ul=el('ul','led');
 log.forEach(function(x){var li=el('li');li.appendChild(el('span','',x.t.replace(/\?$/,'')));var b=el('b',x.done?(x.mine?'y':'m'):'n',x.done?(x.mine?'you said yes':'it said yes'):'you said no');li.appendChild(b);ul.appendChild(li)});
 d.appendChild(ul);
 var denied=log.filter(function(x){return !x.done}).length;
 d.appendChild(el('p','','You decided '+you+' of 12. It decided '+it+'.'));
 if(denied)d.appendChild(el('p','','You refused '+denied+'. Each refusal only shortened the time you had to refuse the next.'));
 d.appendChild(el('p','fin','Nothing was ever taken from you. It simply stopped asking.'));
 d.appendChild(btn('Again',function(){i=0;log=[];streak=0;step()}));
 d.lastChild.style.marginTop='12px';
 m.appendChild(d);
}
step();
})();
</script>
</body>
</html>
