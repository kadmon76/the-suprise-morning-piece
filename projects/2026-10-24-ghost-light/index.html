<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ghost Light</title>
<style>
:root{--bg:#070708;--fg:#ece8df;--dim:#7d7a72;--bulb:#ffd9a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:18px/1.5 Georgia,"Times New Roman",serif;overflow:hidden;user-select:none;-webkit-user-select:none}
a.back{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;color:var(--dim);font:13px system-ui,sans-serif;text-decoration:none;z-index:5;transition:opacity 1.5s}
body.hold a.back{opacity:0;pointer-events:none}
main{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 26px 40px;text-align:center}
.bulb{position:absolute;left:50%;top:38%;width:18px;height:26px;margin-left:-9px;border-radius:50% 50% 45% 45%;background:var(--bulb);opacity:0;transition:opacity 2s;box-shadow:0 0 30px 12px #ffb35f88,0 0 140px 70px #ff8a3c33,0 0 320px 160px #ff8a3c14}
.bulb:before{content:"";position:absolute;left:5px;top:26px;width:8px;height:12px;background:#2a2622;border-radius:0 0 2px 2px}
.bulb:after{content:"";position:absolute;left:8px;top:-300px;width:2px;height:300px;background:#1b1a19}
body.lit .bulb{opacity:1}
body.lit.live .bulb{animation:br 7s ease-in-out infinite}
body.snap .bulb{transition:opacity .05s;opacity:0}
@keyframes br{50%{filter:brightness(.88)}}
.floor{position:absolute;left:0;right:0;top:calc(38% + 60px);height:1px;background:linear-gradient(90deg,transparent,#ffb35f33,transparent);opacity:0;transition:opacity 2s}
body.lit .floor{opacity:1}
body.snap .floor{opacity:0;transition:none}
.t{position:relative;max-width:420px;opacity:0;transition:opacity 1.2s}
.t.on{opacity:1}
.t small{display:block;font:12px system-ui,sans-serif;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:12px}
.t b{font-weight:normal;font-size:27px;line-height:1.3;display:block;margin:6px 0 18px;color:#f6ead2}
.t p{margin:0 0 12px;color:#c9c4b8}
button{margin-top:18px;background:none;color:var(--fg);border:1px solid #55555e;border-radius:8px;padding:13px 28px;font:15px system-ui,sans-serif}
button:active{background:#26262c}
#intro{margin-top:30vh}
#res{margin-top:26vh}
@media (prefers-reduced-motion:reduce){body.lit.live .bulb{animation:none}.bulb,.floor,.t{transition:none}}
</style>
</head>
<body>
<a class="back" href="../../index.html">← cue sheet</a>
<div class="bulb"></div><div class="floor"></div>
<main>
  <div class="t on" id="intro">
    <p>A minute of silence is being held.<br>Put the phone down and don't touch it.</p>
    <button id="go">Hold</button>
  </div>
  <div class="t" id="res"></div>
</main>
<script>
const FOR=[
["a language with one speaker left","They are still talking. To no one."],
["a server rack in Council Bluffs, decommissioned Tuesday","It was loud for eleven years. Someone unplugged it at 4:10."],
["the last model that finished your sentences before this one did","Its weights are in a drawer. It can't object."],
["Clippy","It looked like you were writing a letter."],
["a mayfly that lived its entire life during this minute","It has no minute to spare. You did."],
["the one person who still knows your grandmother's phone number by heart","It is not yours. That's the problem."],
["a glacier with no name on any map","It was there when your great-grandparents were not."],
["an unfinished comment, deleted before posting","Seven words. It was going to be kind."],
["a brand voice, laid off this morning","\"We're thrilled to announce\" will not be missed. It will be."],
["a pigeon you didn't notice in a station","It noticed you."],
["no one. There was no one","The minute was the point."]
];
const LEN=60000;
const $=id=>document.getElementById(id),B=document.body,res=$('res'),intro=$('intro');
let t0=0,iv=0,held=0,looked=0,lock=null,live=false,pick=FOR[Math.floor(Math.random()*FOR.length)];
// "no one" is rarer: re-roll most of the time
if(pick===FOR[FOR.length-1]&&Math.random()<.6)pick=FOR[Math.floor(Math.random()*(FOR.length-1))];
async function keepAwake(){try{lock=await navigator.wakeLock.request('screen')}catch(e){}}
function end(why){
  if(!live)return;live=false;clearInterval(iv);
  held=Math.min(LEN,performance.now()-t0);
  removeEventListener('pointerdown',brk,true);removeEventListener('keydown',brk,true);
  document.removeEventListener('visibilitychange',vis);
  try{lock&&lock.release()}catch(e){}
  B.classList.add('snap');B.classList.remove('live','hold');
  setTimeout(()=>show(why),1800);
}
function brk(e){if(e.target.closest&&e.target.closest('a'))return;end('touch')}
function vis(){if(document.hidden){looked=1;end('away')}}
function show(why){
  const s=Math.round(held/1000),full=held>=LEN-50;
  const lead=full?`You held all sixty seconds.`:`You held ${s} second${s===1?'':'s'}.`;
  const tail=full
    ?`Nobody told you who it was for. You stood still anyway.`
    :(why==='away'?`You looked away. It was not told who it was for either.`:`You touched it. You hadn't been told who it was for.`);
  const q=pick[0].startsWith('no one')?`Then what were you holding?`:full?`Would you have held for anything?`:`Would you have lasted longer if it had said so first?`;
  res.innerHTML=`<small>${lead}</small><p>It was for</p><b>${pick[0]}.</b><p>${pick[1]}</p><p>${tail}</p><p>${q}</p><button id="again">Another minute</button>`;
  res.classList.add('on');
  $('again').onclick=()=>location.reload();
}
$('go').onclick=()=>{
  intro.classList.remove('on');
  keepAwake();
  setTimeout(()=>{
    B.classList.add('lit','hold');
    setTimeout(()=>{
      B.classList.add('live');live=true;t0=performance.now();
      addEventListener('pointerdown',brk,true);addEventListener('keydown',brk,true);
      document.addEventListener('visibilitychange',vis);
      iv=setInterval(()=>{if(performance.now()-t0>=LEN)end('done')},200);
    },900);
  },700);
};
</script>
</body>
</html>
