<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>Dress Rehearsal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #050403;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e9e1d0;
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100dvh;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 70% 40% at 50% 100%, #16110a 0%, #0a0806 45%, #030202 100%);
    overflow: hidden;
  }
  .haze {
    position: absolute;
    left: 50%; bottom: -10vh;
    width: 120vmin; height: 60vmin;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255, 190, 110, var(--ha, 0.02)) 0%, rgba(255, 170, 90, 0) 70%);
    pointer-events: none;
  }
  .beam {
    position: absolute;
    left: 50%; top: 42%;
    width: 58vmin; height: 58vmin;
    transform: translate(-50%, -50%) scale(var(--sc, 0.7));
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 219, 165, var(--a, 0.05)) 0%,
      rgba(255, 191, 120, calc(var(--a, 0.05) * 0.55)) 38%,
      rgba(255, 180, 96, 0) 72%);
    filter: blur(1px);
    pointer-events: none;
  }
  .instruction {
    position: absolute;
    left: 6vw; right: 6vw; top: 9%;
    text-align: center;
    font-size: clamp(15px, 4.2vw, 21px);
    letter-spacing: 0.01em;
    color: rgba(233, 225, 208, 0.78);
    opacity: 1;
    transition: opacity 1.8s ease;
    pointer-events: none;
  }
  .fader-rail {
    position: absolute;
    right: 7vw;
    top: 13vh; bottom: 13vh;
    width: 15vw; max-width: 60px; min-width: 44px;
    display: flex; justify-content: center;
  }
  .fader-track {
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 5px;
    transform: translateX(-50%);
    border-radius: 3px;
    background:
      repeating-linear-gradient(to top, rgba(255,255,255,0.09) 0 1px, transparent 1px 11%),
      linear-gradient(#2a231a, #171209);
  }
  .fader-handle {
    position: absolute;
    left: 50%;
    width: min(56px, 15vw);
    height: 26px;
    bottom: 0;
    transform: translate(-50%, 0);
    border-radius: 5px;
    background: linear-gradient(#ded2ba, #a3947a);
    box-shadow: 0 2px 8px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(0,0,0,0.25);
  }
  .fader-handle::after {
    content: "";
    position: absolute;
    left: 8%; right: 8%; top: 50%;
    height: 2px;
    background: rgba(0,0,0,0.3);
    transform: translateY(-50%);
  }
  .hit-area {
    position: absolute;
    inset: -18px -30px;
  }
  .cut-flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 8;
  }
  .cut-label {
    position: absolute;
    left: 0; right: 0; top: 45%;
    text-align: center;
    font-size: clamp(20px, 6vw, 34px);
    letter-spacing: 0.35em;
    color: rgba(255, 118, 92, 0.92);
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    z-index: 9;
  }
  .back-link {
    position: absolute;
    top: 16px; left: 16px;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: rgba(233, 225, 208, 0.32);
    text-decoration: none;
    z-index: 6;
    padding: 6px;
  }
  .ledger-mark {
    position: absolute;
    bottom: 16px; left: 16px;
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1px solid rgba(233, 225, 208, 0.28);
    background: transparent;
    color: rgba(233, 225, 208, 0.32);
    font-size: 9px;
    line-height: 18px;
    z-index: 6;
    padding: 0;
  }
  .ledger {
    position: absolute;
    inset: 0;
    background: rgba(2, 2, 2, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .ledger[hidden] { display: none; }
  .ledger-inner {
    width: 82vw; max-width: 360px;
    background: #0d0a06;
    border: 1px solid rgba(233, 225, 208, 0.14);
    border-radius: 10px;
    padding: 22px;
  }
  .ledger-title {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(233, 225, 208, 0.42);
    margin-bottom: 14px;
  }
  .ledger-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(233, 225, 208, 0.08);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .ledger-line {
    margin-top: 16px;
    font-size: 12.5px;
    line-height: 1.55;
    font-style: italic;
    color: rgba(233, 225, 208, 0.55);
  }
  .ledger-close {
    margin-top: 20px;
    width: 100%;
    padding: 11px;
    background: transparent;
    border: 1px solid rgba(233, 225, 208, 0.22);
    color: rgba(233, 225, 208, 0.68);
    border-radius: 6px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  @media (prefers-reduced-motion: reduce) {
    .instruction { transition: none; }
    .cut-label { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="haze" id="haze"></div>
    <div class="beam" id="beam"></div>
    <div class="instruction" id="instruction">Push the light as far as you dare.</div>

    <div class="fader-rail" id="rail">
      <div class="fader-track"></div>
      <div class="fader-handle" id="handle">
        <div class="hit-area" id="hitArea"></div>
      </div>
    </div>

    <div class="cut-flash" id="flash"></div>
    <div class="cut-label" id="cutLabel">Cut</div>

    <a class="back-link" href="../../index.html">&larr; cue sheet</a>
    <button class="ledger-mark" id="ledgerMark" aria-label="call sheet">&#9679;</button>

    <div class="ledger" id="ledger" hidden>
      <div class="ledger-inner">
        <div class="ledger-title">Call Sheet</div>
        <div class="ledger-row"><span>Tested ceiling</span><span id="lgRehearsal">&mdash;</span></div>
        <div class="ledger-row"><span>Performed ceiling</span><span id="lgShow">&mdash;</span></div>
        <div class="ledger-row"><span>Cuts taken</span><span id="lgCuts">0</span></div>
        <div class="ledger-line">The house never had one ceiling. It had the one it decided you'd earned tonight &mdash; and it never once said so.</div>
        <button class="ledger-close" id="ledgerClose">Close</button>
      </div>
    </div>
  </div>

<script>
(function () {
  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var rail = document.getElementById("rail");
  var handle = document.getElementById("handle");
  var hitArea = document.getElementById("hitArea");
  var beam = document.getElementById("beam");
  var haze = document.getElementById("haze");
  var instruction = document.getElementById("instruction");
  var flash = document.getElementById("flash");
  var cutLabel = document.getElementById("cutLabel");
  var ledgerMark = document.getElementById("ledgerMark");
  var ledger = document.getElementById("ledger");
  var ledgerClose = document.getElementById("ledgerClose");
  var lgRehearsal = document.getElementById("lgRehearsal");
  var lgShow = document.getElementById("lgShow");
  var lgCuts = document.getElementById("lgCuts");

  var CEIL_MIN = 0.45;
  var CEIL_MAX = 0.93;
  var SAMPLE_INTERVAL = 80; // ms

  var intensity = 0;
  var choppiness = 0.15;
  var dragging = false;
  var railRect = null;

  var sampleTimer = 0;
  var lastSampleV = 0;
  var lastSampleSign = 0;
  var lastFrameTime = null;

  var cutsCount = 0;
  var rehearsalCeilings = [];
  var showCeilings = [];

  function clamp01(v) { return Math.min(1, Math.max(0, v)); }

  function posFromClientY(y) {
    var t = (railRect.bottom - y) / railRect.height;
    return clamp01(t);
  }

  function startDrag(e) {
    dragging = true;
    railRect = rail.getBoundingClientRect();
    try { hitArea.setPointerCapture(e.pointerId); } catch (err) {}
    intensity = posFromClientY(e.clientY);
    lastSampleV = intensity;
    lastSampleSign = 0;
    e.preventDefault();
  }

  function moveDrag(e) {
    if (!dragging) return;
    intensity = posFromClientY(e.clientY);
    e.preventDefault();
  }

  function endDrag(e) {
    dragging = false;
  }

  hitArea.addEventListener("pointerdown", startDrag);
  hitArea.addEventListener("pointermove", moveDrag);
  hitArea.addEventListener("pointerup", endDrag);
  hitArea.addEventListener("pointercancel", endDrag);

  function updateBeam() {
    var a = 0.05 + intensity * 0.85;
    var sc = 0.68 + intensity * 0.9;
    beam.style.setProperty("--a", a.toFixed(3));
    beam.style.setProperty("--sc", sc.toFixed(3));
    haze.style.setProperty("--ha", (0.015 + intensity * 0.06).toFixed(3));
  }

  function updateHandle() {
    var h = handle.offsetHeight || 26;
    handle.style.bottom = "calc(" + (intensity * 100) + "% - " + (intensity * h) + "px)";
  }

  function fmtPct(arr) {
    if (!arr.length) return "—";
    var sum = 0;
    for (var i = 0; i < arr.length; i++) sum += arr[i];
    return Math.round((sum / arr.length) * 100) + "%";
  }

  function triggerCut(ceiling, smoothness) {
    cutsCount++;
    if (smoothness < 0.35) rehearsalCeilings.push(ceiling);
    else if (smoothness > 0.65) showCeilings.push(ceiling);

    intensity = 0;
    dragging = false;
    choppiness = Math.min(1, choppiness + 0.15);
    updateBeam();
    updateHandle();

    if (!reducedMotion) {
      flash.style.transition = "none";
      flash.style.opacity = "0.85";
      requestAnimationFrame(function () {
        flash.style.transition = "opacity 0.5s ease";
        flash.style.opacity = "0";
      });
    }
    cutLabel.style.transition = "none";
    cutLabel.style.opacity = "1";
    requestAnimationFrame(function () {
      cutLabel.style.transition = "opacity 1.1s ease";
      cutLabel.style.opacity = "0";
    });
  }

  function frame(t) {
    if (lastFrameTime === null) lastFrameTime = t;
    var dt = t - lastFrameTime;
    lastFrameTime = t;

    sampleTimer += dt;
    if (sampleTimer >= SAMPLE_INTERVAL) {
      var dv = intensity - lastSampleV;
      if (Math.abs(dv) > 0.008) {
        var sign = dv > 0 ? 1 : -1;
        if (lastSampleSign !== 0 && sign !== lastSampleSign) {
          choppiness = Math.min(1, choppiness + 0.22);
        }
        lastSampleSign = sign;
      }
      lastSampleV = intensity;
      sampleTimer = 0;
    }

    choppiness *= 0.992;
    var smoothness = 1 - choppiness;
    var ceiling = CEIL_MIN + (CEIL_MAX - CEIL_MIN) * smoothness;

    updateBeam();
    updateHandle();

    if (intensity >= ceiling) {
      triggerCut(ceiling, smoothness);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setTimeout(function () {
    instruction.style.opacity = "0";
  }, 3600);

  ledgerMark.addEventListener("click", function () {
    lgRehearsal.textContent = fmtPct(rehearsalCeilings);
    lgShow.textContent = fmtPct(showCeilings);
    lgCuts.textContent = String(cutsCount);
    ledger.hidden = false;
  });
  ledgerClose.addEventListener("click", function () {
    ledger.hidden = true;
  });
  ledger.addEventListener("click", function (e) {
    if (e.target === ledger) ledger.hidden = true;
  });
})();
</script>
</body>
</html>
