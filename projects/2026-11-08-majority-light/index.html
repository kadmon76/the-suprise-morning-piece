<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Everyone Else Saw B</title>
<style>
:root{--bg:#0b0a0c;--fg:#e8e2d6;--dim:#7d776c;--amber:#ffb347;--blue:#4f8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:manipulation}
a.back{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;color:var(--dim);font:13px/1 system-ui,sans-serif;text-decoration:none;z-index:5}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:56px 18px max(22px,env(safe-area-inset-bottom))}
#line{font-size:20px;line-height:1.35;text-align:center;min-height:56px;max-width:360px}
#lamps{display:flex;gap:18px;width:100%;max-width:420px;justify-content:center}
.lamp{flex:1;max-width:190px;aspect-ratio:1/1.3;border:0;border-radius:16px;background:#14120f;position:relative;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;color:var(--dim);font:13px system-ui,sans-serif;letter-spacing:.2em;overflow:hidden;outline-offset:3px}
.lamp i{position:absolute;inset:14% 14% 26%;border-radius:50%;background:var(--amber)}
.lamp.mine{outline:2px solid var(--blue)}
.lamp[disabled]{cursor:default}
#crowd{width:100%;max-width:360px;min-height:92px;text-align:center;font:13px system-ui,sans-serif;color:var(--dim);letter-spacing:.08em}
#bar{height:8px;border-radius:4px;background:#1d1a16;overflow:hidden;margin:8px 0;display:flex}
#bar b{display:block;height:100%;width:0;background:var(--fg);transition:width 1.3s ease-out}
#n{font-size:22px;color:var(--fg);letter-spacing:.02em;font-family:Georgia,serif}
#act{display:flex;gap:12px;width:100%;max-width:360px;min-height:50px}
#act button{flex:1;border:1px solid var(--dim);background:none;color:var(--fg);border-radius:12px;font:14px system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;padding:14px 0;cursor:pointer}
#act button:active{background:#1d1a16}
#end{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;text-align:center;overflow:auto}
#end.on{display:flex}
#end p{max-width:360px;line-height:1.5;font-size:18px;margin:10px 0}
#end small{color:var(--dim);font:13px/1.5 system-ui,sans-serif;max-width:340px}
#strip{display:flex;gap:8px;margin:12px 0}
.d{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--dim)}
.d.h{background:var(--fg);border-color:var(--fg)}
.d.s{outline:1.5px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#bar b{transition:none}}
</style></head><body>
<a class="back" href="../../index.html">← cue sheet</a>
<main>
<div id="line">Which lamp is brighter?</div>
<div id="lamps"><button class="lamp" id="A" aria-label="Left lamp"><i></i>A</button><button class="lamp" id="B" aria-label="Right lamp"><i></i>B</button></div>
<div id="crowd" aria-live="polite"></div>
<div id="act"></div>
</main>
<div id="end"><div id="strip"></div><p id="t1"></p><p id="t2"></p><small id="t3"></small></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
// [bright, dim]; equal = no right answer
const R=[[1,.5],[.92,.58],[.85,.68],[.8,.72],[1,1],[.78,.76],[.9,.9]];
let r=0,res=[],stage=0,truth,mine,first;
const nm=i=>i?'B':'A';
function setup(){
  const [a,b]=R[r];const swap=Math.random()<.5;
  const va=swap?b:a,vb=swap?a:b;
  truth=a===b?-1:(va>vb?0:1);
  [['A',va],['B',vb]].forEach(([id,v])=>{const l=$(id);l.disabled=false;l.classList.remove('mine');l.firstElementChild.style.opacity=(.12+v*.88).toFixed(3);l.firstElementChild.style.boxShadow='0 0 '+Math.round(v*70)+'px '+Math.round(v*18)+'px rgba(255,179,71,'+(v*.55).toFixed(2)+')'});
  $('line').textContent='Which lamp is brighter?';
  $('crowd').innerHTML='';$('act').innerHTML='';stage=0;
}
function pick(i){
  if(stage)return;stage=1;first=i;mine=i;
  $('A').disabled=$('B').disabled=true;$(i?'B':'A').classList.add('mine');
  $('line').textContent='You said '+nm(i)+'.';
  const pct=61+Math.floor(Math.random()*30);
  const total=(2000+Math.floor(Math.random()*7000));
  $('crowd').innerHTML='<div id="n">…</div><div id="bar"><b></b></div><div id="cl"></div>';
  setTimeout(()=>{
    $('n').textContent=total.toLocaleString()+' others';
    $('cl').textContent=pct+'% say '+nm(1-i);
    $('bar').firstElementChild.style.width=pct+'%';
    $('act').innerHTML='<button id="k">Keep '+nm(i)+'</button><button id="s">Switch to '+nm(1-i)+'</button>';
    $('k').onclick=()=>fin(i);$('s').onclick=()=>fin(1-i);
    stage=2;
  },reduce?50:700);
}
function fin(c){
  if(stage!==2)return;stage=3;
  res.push({first,final:c,truth,sw:c!==first});
  r++;
  if(r>=R.length)setTimeout(end,250);else setup();
}
function end(){
  $('end').classList.add('on');
  const st=$('strip');
  res.forEach(x=>{const d=document.createElement('div');d.className='d'+(x.truth<0?'':(x.final===x.truth?' h':''))+(x.sw?' s':'');st.appendChild(d)});
  const sw=res.filter(x=>x.sw).length;
  const real=res.filter(x=>x.truth>=0);
  const lost=real.filter(x=>x.sw&&x.first===x.truth).length;
  const gained=real.filter(x=>x.sw&&x.first!==x.truth).length;
  const fake=res.filter(x=>x.truth<0&&x.sw).length;
  $('t1').textContent=sw===0?'You never moved. Every time, the crowd was against you.':'You moved '+sw+' time'+(sw>1?'s':'')+'. Every time, the crowd was against you.';
  let s2='There was no crowd. Each number was drawn after your pick, and aimed at it.';
  if(lost>0)s2+=' '+lost+' time'+(lost>1?'s':'')+' you were right and gave it up.';
  if(fake>0)s2+=' '+(fake>1?fake+' times':'Once')+' there was no brighter lamp at all, and you still found one to agree on.';
  $('t2').textContent=s2;
  $('t3').textContent='Filled: right in the end. Ringed blue: you switched. Empty: wrong, or nothing to be right about.'+(gained?' Switching rescued you '+gained+' time'+(gained>1?'s':'')+' — by luck, not by the crowd.':'');
}
$('A').onclick=()=>pick(0);$('B').onclick=()=>pick(1);
setup();
})();
</script>
</body></html>
