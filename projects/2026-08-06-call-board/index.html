<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0906">
<title>(Leave It for the Next One.) · The Surprise Morning Piece</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Caveat:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0906;overflow:hidden;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;}
  body{font-family:Georgia,'Times New Roman',serif;color:#d8cdb4}

  a.back{
    position:fixed;top:14px;left:14px;z-index:20;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:#7c7264;text-decoration:none;
    padding:6px 10px;border:1px solid rgba(216,205,180,.14);border-radius:99px;
    background:rgba(7,7,6,.5);backdrop-filter:blur(4px);
  }

  .hint{
    position:fixed;top:18px;left:0;right:0;z-index:5;text-align:center;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
    letter-spacing:.16em;text-transform:uppercase;color:#5c5448;
    pointer-events:none;
  }

  .bulb{
    position:fixed;top:-40vh;left:50%;transform:translateX(-50%);
    width:140vw;height:80vh;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%, rgba(255,224,168,.10), rgba(255,224,168,0) 60%);
  }
  @media (prefers-reduced-motion: no-preference){
    .bulb{ animation:flicker 7s ease-in-out infinite; }
  }
  @keyframes flicker{
    0%,100%{opacity:1} 42%{opacity:.86} 44%{opacity:1} 71%{opacity:.92} 73%{opacity:1}
  }

  .wrap{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
    padding:52px 10px 10px;}

  .board{
    position:relative;flex:1.25;min-height:0;
    background:
      radial-gradient(circle at 12% 18%, rgba(0,0,0,.35), transparent 40%),
      radial-gradient(circle at 82% 70%, rgba(0,0,0,.3), transparent 45%),
      #7a5f3d;
    background-blend-mode:multiply;
    border-radius:6px;
    box-shadow:inset 0 0 40px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.03);
    display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);
  }
  .board::before{
    content:'';position:absolute;inset:0;border-radius:6px;opacity:.5;
    background-image:radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.4px);
    background-size:7px 7px;
  }

  .slot{position:relative;display:flex;align-items:center;justify-content:center;padding:6px}

  .note{
    position:relative;width:92%;max-width:150px;min-height:64px;
    padding:10px 9px 8px;border-radius:2px;
    box-shadow:0 3px 7px rgba(0,0,0,.45);
    cursor:pointer;transition:transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
    display:flex;align-items:center;
  }
  .note .pin{
    position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e8817a, #8a2e28 75%);
    box-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  .note .txt{font-size:12.5px;line-height:1.32;color:#20200f}
  .note .scrap{opacity:.75}
  .note.read{box-shadow:0 5px 14px rgba(0,0,0,.55)}
  .note:active{transform:scale(.97) !important}

  .ink-a .txt{font-family:'Kalam',cursive;color:#1c1c1c}
  .ink-b .txt{font-family:'Caveat',cursive;font-size:15px;color:#1f3f6b}
  .ink-c .txt{font-family:'Special Elite',ui-monospace,monospace;font-size:10.5px;color:#2a2a20}

  .transcript{
    flex:1;min-height:0;margin-top:10px;overflow-y:auto;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
    line-height:1.55;color:#a89a78;padding:2px 6px;
  }
  .transcript .line{opacity:0;margin-bottom:7px;
    transform:translateY(3px);transition:opacity .5s ease, transform .5s ease;}
  .transcript .line.dim{opacity:.4}
  .transcript .line.on{opacity:1;transform:translateY(0);color:#e9dfce}
  .transcript .line.cont{color:#7c96b5;font-style:italic}
  .transcript .dots{letter-spacing:.3em;color:#4a4438}

  @media (prefers-reduced-motion: reduce){
    .note{transition:none}
    .transcript .line{transition:none}
  }
</style>
</head>
<body>

<a class="back" href="../../index.html">&larr; cue sheet</a>
<div class="hint">tap the notes</div>
<div class="bulb"></div>

<div class="wrap">
  <div class="board" id="board"></div>
  <div class="transcript" id="transcript"></div>
</div>

<script>
(function(){
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // true, fixed narrative order — never changes regardless of tap order
  var notes = [
    "Side door sticks — don't force it, wait for the click.",
    "Board's clear again. Use it, but don't sign it.",
    "If anyone asks, we're doing inventory.",
    "They read the last one. New spot from now on.",
    "Nobody checks the loading dock after eleven.",
    "Bring nothing you'd need to explain.",
    "Same time. Different door if this one's being watched.",
    "See you outside."
  ];

  // spatial order the board is laid out in (reading order top-left -> bottom-right)
  // deliberately NOT the narrative order above
  var layout = [5,2,8,1,6,3,7,4]; // 1-based indices into notes[]

  var inks = ['ink-a','ink-b','ink-c'];

  var board = document.getElementById('board');
  var transcript = document.getElementById('transcript');
  var lineEls = [];

  notes.forEach(function(t, i){
    var line = document.createElement('div');
    line.className = 'line dim';
    line.innerHTML = '<span class="dots">' + '·'.repeat(6 + (i%3)) + '</span>';
    transcript.appendChild(line);
    lineEls.push(line);
  });
  var contLine = document.createElement('div');
  contLine.className = 'line cont';
  contLine.textContent = '— continued.';
  transcript.appendChild(contLine);

  layout.forEach(function(trueIdx, slotPos){
    var slot = document.createElement('div');
    slot.className = 'slot';

    var note = document.createElement('div');
    var ink = inks[slotPos % inks.length];
    note.className = 'note ' + ink;
    var rot = ((slotPos * 37) % 11) - 5;
    note.style.transform = 'rotate(' + rot + 'deg)';
    note.style.background = (slotPos % 2 === 0) ? '#e9e0c4' : '#efe6cf';

    var pin = document.createElement('div');
    pin.className = 'pin';
    note.appendChild(pin);

    var txt = document.createElement('div');
    txt.className = 'txt scrap';
    var full = notes[trueIdx - 1];
    var scrapLen = 3 + (trueIdx % 3);
    var words = full.split(' ');
    txt.textContent = words.slice(0, scrapLen).join(' ') + ' …';
    note.appendChild(txt);

    note.addEventListener('click', function(){
      if (note.classList.contains('read')) return;
      note.classList.add('read');
      txt.classList.remove('scrap');
      txt.textContent = full;
      note.style.transform = reduced ? 'rotate(0deg)' : 'rotate(0deg) scale(1.08)';
      setTimeout(function(){
        note.style.transform = 'rotate(' + (rot / 3) + 'deg)';
      }, reduced ? 0 : 650);

      var line = lineEls[trueIdx - 1];
      line.classList.remove('dim');
      line.classList.add('on');
      line.textContent = full;
    }, {passive:true});

    slot.appendChild(note);
    board.appendChild(slot);
  });

  setTimeout(function(){
    contLine.classList.add('on');
  }, 19000);
})();
</script>
</body>
</html>
