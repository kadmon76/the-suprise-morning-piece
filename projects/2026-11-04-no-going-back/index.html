<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>No Going Back</title>
<style>
:root{--bg:#07070a;--fg:#e9e4d8;--dim:#6d6a62;--amb:#ffb347}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.4 Georgia,serif;overflow:hidden;touch-action:manipulation;user-select:none}
a.back{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;color:var(--dim);font:13px sans-serif;text-decoration:none;z-index:5;padding:8px 0}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 20px 24px}
#stage{position:relative;width:min(70vw,300px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
#lamp{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#fff6e0 0%,var(--amb) 45%,rgba(255,179,71,0) 70%);opacity:0;transition:opacity .25s}
#lamp.stat{background:radial-gradient(circle,#fff 0,#8fb8ff 45%,rgba(143,184,255,0) 70%)}
#bars{display:flex;gap:3px;align-items:flex-end;height:56px;margin:28px 0 8px;width:min(90vw,340px);justify-content:center}
#bars i{flex:1;max-width:14px;background:var(--dim);border-radius:2px 2px 0 0;opacity:.8}
#bars i.mine{background:var(--amb);opacity:1}
#bars i.best{outline:1px solid var(--fg)}
#msg{min-height:3.2em;text-align:center;color:var(--dim);font-size:15px;max-width:30em}
#btn{margin-top:14px;width:min(80vw,300px);padding:18px;border:1px solid var(--fg);background:none;color:var(--fg);font:18px Georgia,serif;border-radius:40px;letter-spacing:.04em}
#btn:active{background:var(--fg);color:var(--bg)}
#btn[disabled]{opacity:.25}
#end{white-space:pre-line;text-align:left;max-width:26em;line-height:1.55}
@media (prefers-reduced-motion:reduce){#lamp{transition:none}}
</style></head><body>
<a class="back" href="../../index.html">← cue sheet</a>
<div id="app">
<div id="stage"><div id="lamp"></div></div>
<div id="bars"></div>
<div id="msg">Twenty lamps will pass, one at a time. Keep one.</div>
<button id="btn">Begin</button>
</div>
<script>
(function(){
var N=20,ROUNDS=5,STEP=1100,rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
var lamp=document.getElementById('lamp'),bars=document.getElementById('bars'),msg=document.getElementById('msg'),btn=document.getElementById('btn');
var round=0,vals,i,pick,timer,state='idle',hist=[];
function shuffle(a){for(var k=a.length-1;k>0;k--){var j=Math.random()*(k+1)|0,t=a[k];a[k]=a[j];a[j]=t}return a}
function start(){
 round++;vals=shuffle(Array.from({length:N},function(_,k){return (k+1)/N}));
 i=-1;pick=-1;bars.innerHTML='';state='run';
 msg.textContent='Round '+round+' of '+ROUNDS+'. Past lamps cannot be recalled.';
 btn.textContent='This one';btn.disabled=false;tick();timer=setInterval(tick,STEP);
}
function tick(){
 i++;
 if(i>=N){ if(pick<0){pick=N-1;} finish();return}
 lamp.className=''; lamp.style.opacity=0;
 requestAnimationFrame(function(){lamp.style.opacity=.15+vals[i]*.85});
 var b=document.createElement('i');b.style.height=Math.max(4,vals[i]*56)+'px';b.dataset.k=i;
 /* past lamps are remembered only as faint ticks, not heights, until the end */
 b.style.height='6px';bars.appendChild(b);
 if(pick>=0){b.style.height=Math.max(4,vals[i]*56)+'px'}
}
function take(){
 if(state!=='run'||i<0)return;
 pick=i;state='after';btn.disabled=true;
 bars.children[i].classList.add('mine');
 msg.textContent='Kept. Watch the rest anyway.';
 clearInterval(timer);timer=setInterval(function(){
  i++; if(i>=N){finish();return}
  var b=document.createElement('i');b.style.height=Math.max(4,vals[i]*56)+'px';bars.appendChild(b);
  lamp.style.opacity=.15+vals[i]*.85;
 },rm?200:380);
}
function finish(){
 clearInterval(timer);state='done';
 var rank=0;vals.forEach(function(v){if(v>vals[pick])rank++});rank+=1;
 var bi=vals.indexOf(1);
 Array.prototype.forEach.call(bars.children,function(b,k){b.style.height=Math.max(4,vals[k]*56)+'px';if(k===bi)b.classList.add('best')});
 bars.children[pick]&&bars.children[pick].classList.add('mine');
 hist.push({pos:pick+1,rank:rank,best:bi+1});
 lamp.style.opacity=0;
 var m=rank===1?'You kept the brightest.':'Lamp '+(bi+1)+' was brighter. You kept #'+rank+' of '+N+'.';
 if(rank!==1&&bi<pick)m+=' It had already gone.';
 else if(rank!==1)m+=' It was still to come.';
 msg.textContent=m;
 if(round<ROUNDS){btn.textContent='Again';btn.disabled=false;state='between'}
 else{btn.textContent='…';setTimeout(ending,2200);btn.disabled=true}
}
function ending(){
 var wins=hist.filter(function(h){return h.rank===1}).length;
 var avg=hist.reduce(function(s,h){return s+h.pos},0)/hist.length;
 var early=hist.filter(function(h){return h.pos<=7}).length;
 var t='Five rounds. You kept the brightest '+wins+' time'+(wins===1?'':'s')+'.\n'+
 'You stopped at lamp '+hist.map(function(h){return h.pos}).join(', ')+' (average '+avg.toFixed(1)+').\n\n'+
 'The best strategy known is to let the first seven pass untouched, then keep the first lamp that beats all of them. It wins about four times in ten. Never more, whoever you are.\n\n'+
 (early>=3?'You took the early light, before you knew what dark looked like. Most people do.':'You waited. Waiting costs you the good ones that came early, and it is still the only way to learn what good is.')+'\n\nThe lamps were random every time. Nobody was withholding anything.';
 bars.style.display='none';document.getElementById('stage').style.display='none';
 msg.id='end';msg.style.color='var(--fg)';msg.textContent=t;btn.style.display='none';
}
btn.addEventListener('click',function(){
 if(state==='idle'||state==='between')start();else if(state==='run')take();
});
})();
</script></body></html>
