<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Proof of Person</title>
<style>
:root{--bg:#060607;--fg:#e2dccd;--dim:#77746b;--warm:#ffcf7a;--bad:#ff8a7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.5 ui-monospace,Menlo,monospace;overflow:hidden;touch-action:none}
a.back{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;color:var(--dim);text-decoration:none;font-size:13px;z-index:5}
#app{height:100%;display:flex;flex-direction:column;padding:44px 18px max(16px,env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
#head{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;min-height:20px}
#stage{flex:1;min-height:0;position:relative;margin:10px 0}
canvas{position:absolute;inset:0;width:100%;height:100%;border:1px solid #1c1d22;border-radius:12px;background:radial-gradient(ellipse 70% 55% at 50% 50%,rgba(255,207,122,.07),transparent 75%)}
#gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#box{display:flex;align-items:center;gap:14px;border:1px solid #2a2c34;background:#101115;border-radius:10px;padding:18px 22px;font-size:16px;color:var(--fg);width:auto;min-height:56px}
#box i{width:26px;height:26px;border:2px solid #555;border-radius:5px;display:block}
#msg{min-height:3.2em;text-align:center;font-size:14px;color:var(--dim);padding:4px 0;transition:color .2s}
#msg.bad{color:var(--bad)}#msg.ok{color:var(--warm)}
#end{display:none;overflow:auto;flex:1;touch-action:pan-y}
#end h2{font-weight:400;font-size:20px;color:var(--warm);margin:8px 0 10px}
#end p{margin:0 0 12px;font-size:14px}
#end .s{color:var(--dim);font-size:12px}
#chart{width:100%;height:150px;display:block;border:1px solid #1c1d22;border-radius:8px;margin:6px 0 10px}
#thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
#thumbs div{width:56px;font-size:9px;text-align:center;color:var(--dim)}
#thumbs canvas{position:static;width:56px;height:56px;display:block;border-radius:6px;border:1px solid #1c1d22;background:#0b0b0d}
#thumbs .p canvas{border-color:#6a5530}
@media (prefers-reduced-motion:reduce){#msg{transition:none}}
</style></head><body>
<a class="back" href="../../index.html">← cue sheet</a>
<div id="app">
 <div id="head"><span id="h1"></span><span id="h2"></span></div>
 <div id="stage"><canvas id="cv"></canvas><div id="gate"><button id="box" style="font-family:inherit;cursor:pointer"><i></i><span>I am a person</span></button></div></div>
 <div id="msg"></div>
 <div id="end"></div>
</div>
<script>
(function(){
var cv=document.getElementById('cv'),cx=cv.getContext('2d'),W=0,H=0,dpr=Math.min(2,window.devicePixelRatio||1);
var msg=document.getElementById('msg'),h1=document.getElementById('h1'),h2=document.getElementById('h2');
var MAX=10,passes=[],log=[],attempts=0,live=false,pts=[],t0=0,ended=false,fade=[];
var BINS=32,C0=0.07,W0=0.05;
function size(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);redraw()}
window.addEventListener('resize',size);
function redraw(){cx.clearRect(0,0,W,H);fade.forEach(function(f){stroke(f.p,'rgba(255,138,122,'+f.a+')')});if(pts.length)stroke(pts,'#ffcf7a')}
function stroke(p,c){if(p.length<2)return;cx.beginPath();cx.moveTo(p[0].x,p[0].y);for(var i=1;i<p.length;i++)cx.lineTo(p[i].x,p[i].y);cx.strokeStyle=c;cx.lineWidth=3;cx.lineCap='round';cx.lineJoin='round';cx.stroke()}
// the window a person is allowed to fall in: centred on the mean of the people so far (you included), narrowing each time
function win(){var n=passes.length,vals=[C0];passes.forEach(function(p){vals.push(p.rough)});
 var c=vals.reduce(function(a,b){return a+b},0)/vals.length;
 var w=W0*Math.pow(0.6,n);return{c:c,w:w,lo:c-w,hi:c+w,sep:0.012*(n+1)}}
function analyse(p){
 var n=p.length,mx=0,my=0,i;for(i=0;i<n;i++){mx+=p[i].x;my+=p[i].y}mx/=n;my/=n;
 var rad=[],ang=[],sr=0;for(i=0;i<n;i++){var dx=p[i].x-mx,dy=p[i].y-my,r=Math.sqrt(dx*dx+dy*dy);rad.push(r);ang.push(Math.atan2(dy,dx));sr+=r}
 var R=sr/n;if(R<8)return null;
 var bins=[],cnt=[],b;for(b=0;b<BINS;b++){bins.push(0);cnt.push(0)}
 for(i=0;i<n;i++){b=Math.min(BINS-1,Math.floor((ang[i]+Math.PI)/(2*Math.PI)*BINS));bins[b]+=rad[i]/R;cnt[b]++}
 var prof=[],empty=0;for(b=0;b<BINS;b++){if(cnt[b]){prof.push(bins[b]/cnt[b])}else{prof.push(null);empty++}}
 for(b=0;b<BINS;b++)if(prof[b]===null){var k=1;while(prof[(b+k)%BINS]===null&&k<BINS)k++;var v=prof[(b+k)%BINS];prof[b]=v===null?1:v}
 var mean=prof.reduce(function(a,c){return a+c},0)/BINS;prof=prof.map(function(v){return v/mean});
 var ss=0;for(i=0;i<n;i++){var d=rad[i]/R-1;ss+=d*d}
 var gap=Math.hypot(p[0].x-p[n-1].x,p[0].y-p[n-1].y)/(2*Math.PI*R);
 return{rough:Math.sqrt(ss/n),gap:gap,prof:prof,R:R,empty:empty/BINS,pts:p}}
function dist(a,b){var s=0;for(var i=0;i<BINS;i++)s+=Math.abs(a[i]-b[i]);return s/BINS}
function judge(a,dur){
 if(!a||a.empty>0.2)return{ok:false,why:'Too short.'};
 if(a.gap>0.22)return{ok:false,why:'Not a closed loop.'};
 if(dur<500)return{ok:false,why:'Too fast.'};
 if(dur>9000)return{ok:false,why:'Too slow.'};
 var w=win();
 if(a.rough<w.lo)return{ok:false,why:'Too regular.',w:w};
 if(a.rough>w.hi)return{ok:false,why:'Too irregular.',w:w};
 var md=1e9;passes.forEach(function(p){md=Math.min(md,dist(a.prof,p.prof))});
 if(md<w.sep)return{ok:false,why:'Seen before.',w:w};
 return{ok:true,w:w}}
function say(t,c){msg.textContent=t;msg.className=c||''}
function status(){h1.textContent=attempts?'verifying':'';h2.textContent=live||attempts?('attempts left '+(MAX-attempts)):''}
document.getElementById('box').addEventListener('click',function(){
 document.getElementById('gate').style.display='none';live=true;size();say('Draw a circle.');status()});
function pos(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()}}
cv.addEventListener('pointerdown',function(e){if(!live||ended)return;e.preventDefault();cv.setPointerCapture(e.pointerId);pts=[pos(e)];t0=performance.now();fade=[];redraw()});
cv.addEventListener('pointermove',function(e){if(!pts.length||!live)return;pts.push(pos(e));redraw()});
function up(e){if(!pts.length||!live||ended)return;var p=pts;pts=[];var dur=performance.now()-t0;
 if(p.length<6){redraw();say('Draw a circle.');return}
 attempts++;var a=analyse(p),j=judge(a,dur);
 log.push({a:a,j:j,dur:dur,pts:p,n:passes.length});
 if(j.ok){passes.push(a);say('Verified. Please verify again.','ok')}
 else{fade=[{p:p,a:0.55}];say(j.why+' Try again.','bad')}
 redraw();status();
 if(passes.length>=6||attempts>=MAX){live=false;setTimeout(finish,1500)}
 else if(j.ok){live=false;setTimeout(function(){fade=[];redraw();live=true;say('Draw a circle.');status()},1100)}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function thumb(l){var c=document.createElement('canvas');c.width=c.height=112;var x=c.getContext('2d'),p=l.pts,i,mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
 p.forEach(function(q){mnx=Math.min(mnx,q.x);mxx=Math.max(mxx,q.x);mny=Math.min(mny,q.y);mxy=Math.max(mxy,q.y)});
 var s=88/Math.max(mxx-mnx,mxy-mny,1),ox=56-(mnx+mxx)/2*s,oy=56-(mny+mxy)/2*s;
 x.beginPath();p.forEach(function(q,i){var X=q.x*s+ox,Y=q.y*s+oy;i?x.lineTo(X,Y):x.moveTo(X,Y)});
 x.strokeStyle=l.j.ok?'#ffcf7a':'#ff8a7a';x.lineWidth=2.5;x.lineJoin='round';x.stroke();return c}
function chart(ct){var w=ct.clientWidth,h=150;ct.width=w*dpr;ct.height=h*dpr;var x=ct.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
 var ymax=0.13,n=log.length;function X(i){return 14+(w-28)*(n<2?0.5:i/(n-1))}function Y(v){return h-12-(h-24)*Math.min(v,ymax)/ymax}
 x.fillStyle='rgba(255,207,122,.14)';x.beginPath();log.forEach(function(l,i){var wd=l.j.w||win();i?x.lineTo(X(i),Y(wd.hi)):x.moveTo(X(i),Y(wd.hi))});
 for(var i=n-1;i>=0;i--){var wd=log[i].j.w||win();x.lineTo(X(i),Y(Math.max(0,wd.lo)))}x.fill();
 log.forEach(function(l,i){if(!l.a)return;x.beginPath();x.arc(X(i),Y(l.a.rough),4,0,7);x.fillStyle=l.j.ok?'#ffcf7a':'#ff8a7a';x.fill()})}
function finish(){ended=true;document.getElementById('stage').style.display='none';msg.style.display='none';
 var e=document.getElementById('end'),won=passes.length>=6;e.style.display='block';
 e.innerHTML='<h2>'+(won?'Verified.':'Unable to verify.')+'</h2>'+
 '<p>'+(won?'You are the average of everyone who has passed. That includes you.':'Humans are expected to be consistent. Humans are expected to be varied. We were unable to tell which you are.')+'</p>'+
 '<div class="s">the band is what counted as a person at each attempt. dots are you.</div><canvas id="chart"></canvas><div id="thumbs"></div>'+
 '<p class="s">'+passes.length+' accepted. '+(log.length-passes.length)+' refused. Each acceptance moved the definition toward you and narrowed it.</p>';
 var t=document.getElementById('thumbs');log.forEach(function(l,i){var d=document.createElement('div');d.className=l.j.ok?'p':'';d.appendChild(thumb(l));var s=document.createElement('span');s.textContent=l.j.ok?'person':l.j.why.replace('.','').toLowerCase();d.appendChild(s);t.appendChild(d)});
 chart(document.getElementById('chart'))}
window.__pop={log:function(){return log},passes:function(){return passes},win:win};
})();
</script></body></html>
