<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Door Split</title>
<style>
:root{--bg:#0b0a0c;--fg:#e8e2d6;--dim:#7d776c;--amber:#ffb347;--blue:#4f8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:manipulation}
a.back{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;color:var(--dim);font:13px/1 system-ui,sans-serif;text-decoration:none;z-index:5}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:56px 18px max(22px,env(safe-area-inset-bottom))}
#line{font-size:20px;line-height:1.35;text-align:center;min-height:56px;max-width:360px}
#bars{display:flex;gap:7px;align-items:flex-end;height:30vh;max-height:260px}
.b{width:20px;border-radius:4px;background:#1b1a1d;transition:background .25s,height .25s}
.b.y{background:var(--blue)}.b.t{background:var(--amber)}.b.off{background:#26242a}
#tot{font:13px system-ui,sans-serif;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;min-height:18px}
#btns{display:flex;gap:14px;width:100%;max-width:420px;height:20vh;max-height:150px}
button{flex:1;border:0;border-radius:14px;font:15px system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
button:active{transform:scale(.985)}
#yes{background:var(--blue);color:#05091a}#no{background:transparent;color:var(--fg);border:1px solid var(--dim)}
button:disabled{opacity:.35}
#end{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;text-align:center;overflow:auto}
#end.on{display:flex}
#end p{max-width:360px;line-height:1.5;font-size:18px;margin:10px 0}
#end small{color:var(--dim);font:13px/1.5 system-ui,sans-serif;max-width:340px}
#strip{display:flex;gap:6px;align-items:flex-end;height:90px;margin:12px 0}
.s{width:16px;border:1.5px solid var(--dim);border-radius:3px}
.s.a{background:var(--blue);border-color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}button:active{transform:none}}
</style></head><body>
<a class="back" href="../../index.html">← cue sheet</a>
<main>
<div id="line"></div>
<div id="bars"></div>
<div id="tot"></div>
<div id="btns"><button id="yes">Take it</button><button id="no">Leave it</button></div>
</main>
<div id="end"><div id="strip"></div><p id="t1"></p><p id="t2"></p><small id="t3"></small></div>
<script>
(function(){
const N=12,$=id=>document.getElementById(id);
let r=0,offer=5,mine=0,theirs=0,log=[],lock=false,rejStreak=0;
const bars=$('bars');
for(let i=0;i<10;i++){const d=document.createElement('div');d.className='b';d.style.height='100%';bars.appendChild(d)}
function paint(o,mode){
  [...bars.children].forEach((b,i)=>{
    b.className='b'+(mode==='off'?' off':i<o?' y':' t');
  });
}
function show(){
  paint(offer);
  $('line').textContent=offer===0?'Tonight the door is yours. Zero.':'The door is ten. Blue is yours: '+offer+'.';
  $('tot').textContent='night '+(r+1)+' of '+N+'  ·  you '+mine+'  ·  house '+theirs;
  lock=false;$('yes').disabled=$('no').disabled=false;
}
function nextOffer(took,o){
  if(took){
    rejStreak=0;
    const rec=log.slice(-3);
    if(rec.length===3&&rec.every(x=>x.took)&&r===N-1)return 0;
    return Math.max(1,Math.random()<.85?o-1:o);
  }
  rejStreak++;
  if(rejStreak===1)return Math.min(6,o+2);
  return Math.min(6,o+1);
}
function act(took){
  if(lock)return;lock=true;$('yes').disabled=$('no').disabled=true;
  log.push({o:offer,took});
  if(took){mine+=offer;theirs+=10-offer;$('line').textContent='Done.'}
  else{paint(0,'off');$('line').textContent='Nobody gets paid.'}
  const nx=nextOffer(took,offer);
  r++;
  setTimeout(()=>{ if(r>=N)finish(); else{offer=nx;show()} },took?650:1100);
}
function finish(){
  const strip=$('strip');
  log.forEach(x=>{const s=document.createElement('div');s.className='s'+(x.took?' a':'');s.style.height=(x.o/6*100||4)+'%';strip.appendChild(s)});
  const acc=log.filter(x=>x.took),first=log[0].o,last=log[N-1].o;
  const avg=acc.length?(acc.reduce((a,x)=>a+x.o,0)/acc.length):0;
  let t1,t2;
  if(!acc.length){t1='You refused every night. It offered up to six.';t2='So the price was never five. It was whatever you made it cost.'}
  else if(acc.length===N){t1='You said yes '+N+' times. The offer went from '+first+' to '+last+'.';t2='Nobody told it what fair was. It only watched what you would take.'}
  else{t1='You took '+acc.length+' of '+N+'. You banked '+mine+'; the house '+theirs+'.';t2='Each refusal cost you a night and raised the offer. Each yes lowered it. The machine never judged. It just listened.'}
  $('t1').textContent=t1;$('t2').textContent=t2;
  $('t3').textContent='Filled bars are nights you accepted. Hollow are nights you left. Its whole method: one step down after a yes, a step up after a no.';
  $('end').classList.add('on');
}
$('yes').onclick=()=>act(true);$('no').onclick=()=>act(false);
show();
window.__test={act:()=>act};
})();
</script>
</body></html>
