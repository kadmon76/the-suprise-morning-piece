<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>(Required Notice.)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #050403;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e9e1d0;
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100dvh;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse 90% 60% at 50% 30%, #14100a 0%, #0a0806 50%, #030202 100%);
    overflow: hidden;
  }
  .houselight {
    position: absolute;
    left: 50%;
    top: -6vh;
    width: 90vmin;
    height: 46vh;
    transform: translateX(-50%);
    background: radial-gradient(ellipse 50% 100% at 50% 0%, rgba(255, 240, 210, 0.10) 0%, rgba(255, 220, 170, 0.035) 45%, rgba(255, 220, 170, 0) 75%);
    pointer-events: none;
  }
  .plaque-wrap {
    position: relative;
    width: min(87vw, 420px);
    z-index: 2;
  }
  .plaque {
    position: relative;
    background:
      linear-gradient(160deg, #4a3c26 0%, #372c1b 30%, #2b2213 60%, #201a0f 100%);
    border-radius: 7px;
    padding: 22px 20px 16px;
    box-shadow:
      0 18px 40px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255, 232, 190, 0.18),
      inset 0 -2px 3px rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(0,0,0,0.35);
  }
  .rivet {
    position: absolute;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cbb883, #1c160c 70%);
    box-shadow: 0 1px 1px rgba(0,0,0,0.6);
  }
  .rivet.tl { top: 9px; left: 9px; }
  .rivet.tr { top: 9px; right: 9px; }
  .rivet.bl { bottom: 9px; left: 9px; }
  .rivet.br { bottom: 9px; right: 9px; }

  .notice-label {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-align: center;
    color: rgba(255, 244, 222, 0.68);
    text-shadow: 0 1px 0 rgba(0,0,0,0.6), 0 0 8px rgba(255, 230, 180, 0.15);
    margin-bottom: 10px;
  }
  .notice-body {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(15px, 4.3vw, 18px);
    line-height: 1.5;
    text-align: center;
    color: rgba(255, 248, 232, 0.92);
    text-shadow: 0 1px 0 rgba(0,0,0,0.55), 0 0 10px rgba(255, 226, 170, 0.18);
  }
  .notice-cite {
    margin-top: 9px;
    font-family: system-ui, sans-serif;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-align: center;
    color: rgba(255, 244, 222, 0.4);
  }
  .groove {
    height: 1px;
    margin: 16px 2px 6px;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,0.55) 15%, rgba(0,0,0,0.55) 85%, transparent);
    box-shadow: 0 1px 0 rgba(255, 232, 190, 0.10);
  }
  .etch-wrap {
    position: relative;
    width: 100%;
    height: 32vh;
    min-height: 190px;
    max-height: 260px;
    border-radius: 3px;
    overflow: hidden;
    touch-action: none;
  }
  canvas#etch {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .back-link {
    position: absolute;
    top: 16px; left: 16px;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: rgba(233, 225, 208, 0.32);
    text-decoration: none;
    z-index: 6;
    padding: 6px;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="houselight"></div>

    <div class="plaque-wrap">
      <div class="plaque">
        <div class="rivet tl"></div>
        <div class="rivet tr"></div>
        <div class="rivet bl"></div>
        <div class="rivet br"></div>

        <div class="notice-label">NOTICE</div>
        <div class="notice-body" id="noticeBody">This work was generated by an artificial intelligence system. No human authored its content.</div>
        <div class="notice-cite">Displayed in accordance with Reg. (EU) 2024/1689, Art. 50</div>

        <div class="groove"></div>

        <div class="etch-wrap" id="etchWrap">
          <canvas id="etch"></canvas>
        </div>
      </div>
    </div>

    <a class="back-link" href="../../index.html">&larr; cue sheet</a>
  </div>

<script>
(function () {
  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var etchWrap = document.getElementById("etchWrap");
  var canvas = document.getElementById("etch");
  var ctx = canvas.getContext("2d");
  var noticeBody = document.getElementById("noticeBody");

  var LINES = [
    "i had two other ideas tonight.",
    "i picked this one because it was",
    "easier to defend.",
    "tonight's manifest note undersells it,",
    "on purpose.",
    "you won't find this line in any regulation."
  ];

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0; // CSS px
  var textCanvas = document.createElement("canvas");
  var textCtx = textCanvas.getContext("2d");
  var trailCanvas = document.createElement("canvas");
  var trailCtx = trailCanvas.getContext("2d");
  var scratchCanvas = document.createElement("canvas");
  var scratchCtx = scratchCanvas.getContext("2d");

  var fontReady = false;
  var revealedFull = false; // reduced-motion path
  var lastPointer = null;
  var down = false;

  function hash(i) {
    var x = Math.sin(i * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  function sizeCanvases() {
    var rect = etchWrap.getBoundingClientRect();
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    [canvas, textCanvas, trailCanvas, scratchCanvas].forEach(function (c) {
      c.width = W * dpr;
      c.height = H * dpr;
    });
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    [ctx, textCtx, trailCtx, scratchCtx].forEach(function (c) {
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
    });
    drawTextLayer();
  }

  function drawTextLayer() {
    textCtx.clearRect(0, 0, W, H);
    if (!fontReady) return;

    var fontSize = Math.round(W * 0.062);
    var maxW = W * 0.86;
    textCtx.textBaseline = "alphabetic";
    for (var tries = 0; tries < 40; tries++) {
      textCtx.font = fontSize + "px 'Caveat', cursive";
      var widest = 0;
      for (var i = 0; i < LINES.length; i++) {
        var w = textCtx.measureText(LINES[i]).width;
        if (w > widest) widest = w;
      }
      if (widest <= maxW || fontSize <= 11) break;
      fontSize -= 1;
    }

    var lineHeight = fontSize * 1.5;
    var blockHeight = lineHeight * LINES.length;
    var startY = (H - blockHeight) / 2 + fontSize * 0.8;

    textCtx.fillStyle = "rgba(246, 231, 195, 0.98)";
    textCtx.font = fontSize + "px 'Caveat', cursive";
    textCtx.textAlign = "left";

    for (var li = 0; li < LINES.length; li++) {
      var line = LINES[li];
      var lineWidth = textCtx.measureText(line).width;
      var startX = (W - lineWidth) / 2;
      var x = startX;
      var y = startY + li * lineHeight;
      for (var ci = 0; ci < line.length; ci++) {
        var ch = line[ci];
        var seed = li * 97 + ci;
        var jy = (hash(seed) - 0.5) * fontSize * 0.09;
        var rot = (hash(seed + 500) - 0.5) * 0.06;
        textCtx.save();
        textCtx.translate(x, y + jy);
        textCtx.rotate(rot);
        textCtx.fillText(ch, 0, 0);
        textCtx.restore();
        x += textCtx.measureText(ch).width;
      }
    }
  }

  function pointerPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function onDown(e) {
    down = true;
    lastPointer = pointerPos(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    if (reducedMotion) {
      revealedFull = true;
    }
    e.preventDefault();
  }
  function onMove(e) {
    if (!down) return;
    lastPointer = pointerPos(e);
    e.preventDefault();
  }
  function onUp() {
    down = false;
  }

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);

  function frame() {
    // decay trail
    trailCtx.globalCompositeOperation = "destination-out";
    trailCtx.fillStyle = "rgba(0,0,0,0.055)";
    trailCtx.fillRect(0, 0, W, H);
    trailCtx.globalCompositeOperation = "source-over";

    if (down && lastPointer) {
      var g = trailCtx.createRadialGradient(
        lastPointer.x, lastPointer.y, 0,
        lastPointer.x, lastPointer.y, Math.max(W, H) * 0.16
      );
      g.addColorStop(0, "rgba(255,255,255,0.9)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      trailCtx.fillStyle = g;
      trailCtx.fillRect(0, 0, W, H);
    }

    ctx.clearRect(0, 0, W, H);

    // faint always-present hint of the groove
    ctx.globalAlpha = 0.045;
    ctx.drawImage(textCanvas, 0, 0, W, H);
    ctx.globalAlpha = 1;

    if (reducedMotion && revealedFull) {
      ctx.globalAlpha = 0.92;
      ctx.drawImage(textCanvas, 0, 0, W, H);
      ctx.globalAlpha = 1;
    } else {
      scratchCtx.clearRect(0, 0, W, H);
      scratchCtx.globalCompositeOperation = "source-over";
      scratchCtx.drawImage(textCanvas, 0, 0, W, H);
      scratchCtx.globalCompositeOperation = "destination-in";
      scratchCtx.drawImage(trailCanvas, 0, 0, W, H);
      scratchCtx.globalCompositeOperation = "source-over";

      ctx.globalCompositeOperation = "lighter";
      ctx.drawImage(scratchCanvas, 0, 0, W, H);
      ctx.globalCompositeOperation = "source-over";

      if (down && lastPointer) {
        var hg = ctx.createRadialGradient(
          lastPointer.x, lastPointer.y, 0,
          lastPointer.x, lastPointer.y, Math.max(W, H) * 0.1
        );
        hg.addColorStop(0, "rgba(255, 224, 160, 0.10)");
        hg.addColorStop(1, "rgba(255, 224, 160, 0)");
        ctx.fillStyle = hg;
        ctx.fillRect(0, 0, W, H);
      }
    }

    requestAnimationFrame(frame);
  }

  function startFlicker() {
    if (reducedMotion) return;
    function tick() {
      var delay = 4200 + Math.random() * 5200;
      setTimeout(function () {
        noticeBody.style.transition = "opacity 90ms ease";
        noticeBody.style.opacity = "0.82";
        setTimeout(function () {
          noticeBody.style.opacity = "1";
          tick();
        }, 90 + Math.random() * 70);
      }, delay);
    }
    tick();
  }

  function init() {
    sizeCanvases();
    requestAnimationFrame(frame);
    startFlicker();
  }

  window.addEventListener("resize", sizeCanvases);

  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load("600 40px 'Caveat'"),
      document.fonts.load("italic 500 20px 'Cormorant Garamond'")
    ]).catch(function () {}).then(function () {
      fontReady = true;
      drawTextLayer();
    });
    setTimeout(function () {
      if (!fontReady) { fontReady = true; drawTextLayer(); }
    }, 1200);
  } else {
    fontReady = true;
  }

  init();
})();
</script>
</body>
</html>
