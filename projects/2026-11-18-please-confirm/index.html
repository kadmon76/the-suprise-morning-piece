<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>(Please Confirm.)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0806;
    --bg-card: #141009;
    --bg-modal: #15110a;
    --amber: #e8b547;
    --amber-dim: #8a6a2c;
    --rust: #b85c3a;
    --ink: #f5efe4;
    --ink-dim: #a99d8a;
    --faint: #5a4a38;
    --brass: #c4913d;
    --line: #2a2217;
    --sx: 2px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Playfair Display', Georgia, serif;
    overflow-x: hidden;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 16px;
    position: relative;
  }
  a { color: var(--ink-dim); text-decoration: none; }

  .back-link {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: 14px;
    font-size: 13px;
    font-style: italic;
    color: var(--ink-dim);
    opacity: 0.55;
    z-index: 2;
  }

  .stage {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding-top: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    min-height: 100dvh;
    justify-content: flex-start;
  }

  /* status card — the "signed in" sign */
  .status-card {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-top: 1px solid #1f1810;
    border-radius: 2px;
    padding: 22px 20px 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 1px 0 #1a130b inset, 0 0 40px rgba(232,181,71,0.04);
  }
  .status-card::before, .status-card::after {
    content: '';
    position: absolute;
    top: 8px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.5), 0 1px 1px rgba(0,0,0,0.6);
  }
  .status-card::before { left: 10px; }
  .status-card::after  { right: 10px; }

  .status-label {
    font-size: 10.5px;
    letter-spacing: 0.22em;
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .status-line {
    font-family: 'Playfair Display', serif;
    font-weight: 400;
    font-size: 30px;
    letter-spacing: 0.02em;
    color: var(--amber);
    text-shadow: 0 0 18px rgba(232,181,71,0.35);
    line-height: 1.1;
  }
  .status-sub {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
    min-height: 14px;
    opacity: 0;
    transition: opacity 400ms ease;
  }
  .status-sub.visible { opacity: 0.9; }

  /* the toggle */
  .toggle-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
  }
  .toggle-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
    text-transform: lowercase;
    opacity: 0.7;
  }
  .toggle {
    position: relative;
    width: 280px;
    max-width: calc(100vw - 48px);
    height: 90px;
    background: #0e0a05;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.65), inset 0 -1px 0 #1c1509;
    touch-action: none;
    overflow: hidden;
    user-select: none;
  }
  .toggle-track {
    position: absolute;
    inset: 10px;
    border-radius: 4px;
    background: linear-gradient(90deg, #120d07 0%, #1a130b 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    pointer-events: none;
  }
  .toggle-end-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .toggle-end-label.active { color: var(--amber-dim); }
  .toggle-handle {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 74px;
    height: 74px;
    border-radius: 6px;
    background: linear-gradient(180deg, #d9a149 0%, #a97821 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,220,160,0.5),
      inset 0 -1px 0 rgba(0,0,0,0.3),
      0 1px 2px rgba(0,0,0,0.6),
      0 0 18px rgba(232,181,71,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    transition: box-shadow 160ms ease;
  }
  .toggle-handle:active { cursor: grabbing; box-shadow:
      inset 0 1px 0 rgba(255,220,160,0.5),
      inset 0 -1px 0 rgba(0,0,0,0.3),
      0 1px 2px rgba(0,0,0,0.6),
      0 0 28px rgba(232,181,71,0.4);
  }
  .toggle-handle::after {
    content: '';
    width: 22px; height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fbe4a8, #8a5a14);
    box-shadow: inset 0 0 6px rgba(0,0,0,0.4);
  }
  .toggle-handle.dragging { transition: none; }
  .toggle-handle.returning { transition: right 320ms cubic-bezier(0.3, 0.7, 0.3, 1); }
  .toggle-handle.committed { transition: right 180ms ease-out; }

  /* ledger mark */
  .ledger-mark {
    position: absolute;
    bottom: max(16px, env(safe-area-inset-bottom));
    right: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--faint);
    opacity: 0.6;
    padding: 10px;
    cursor: pointer;
    user-select: none;
    z-index: 2;
    line-height: 1;
  }
  .ledger-mark:active { color: var(--amber-dim); }

  /* clock — small corner, barely visible, counts session time */
  .session-tick {
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom));
    left: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--faint);
    opacity: 0.35;
    letter-spacing: 0.08em;
    z-index: 2;
  }

  /* modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 3, 1, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
    opacity: 0;
    transition: opacity 240ms ease;
  }
  .modal-overlay.open { display: flex; opacity: 1; }
  .modal {
    width: 100%;
    max-width: 360px;
    background: var(--bg-modal);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 22px 20px 18px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 20px rgba(232,181,71,0.05);
    position: relative;
    transform: translateY(8px);
    opacity: 0;
    transition: transform 260ms cubic-bezier(0.2, 0.7, 0.3, 1), opacity 260ms ease;
  }
  .modal-overlay.open .modal { transform: translateY(0); opacity: 1; }
  .modal::before, .modal::after {
    content: '';
    position: absolute;
    top: 6px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.5);
  }
  .modal::before { left: 8px; }
  .modal::after  { right: 8px; }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 20px;
    line-height: 1.25;
    color: var(--ink);
    margin: 6px 0 10px;
  }
  .modal-body {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    line-height: 1.45;
    color: var(--ink-dim);
    margin: 0 0 18px;
  }
  .modal-reasons {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .reason {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    background: #110c05;
    border: 1px solid #221a0e;
    border-radius: 2px;
    cursor: pointer;
    font-family: 'Playfair Display', serif;
    font-size: 13.5px;
    color: var(--ink-dim);
    line-height: 1.35;
  }
  .reason.selected { border-color: var(--amber-dim); color: var(--ink); }
  .reason-dot {
    flex: 0 0 10px;
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid var(--amber-dim);
    margin-top: 3px;
    background: transparent;
  }
  .reason.selected .reason-dot {
    background: var(--amber);
    box-shadow: 0 0 6px rgba(232,181,71,0.5);
  }

  .modal-buttons {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn {
    padding: 13px 14px;
    border: 1px solid var(--line);
    background: #0e0a05;
    color: var(--ink);
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    border-radius: 2px;
    cursor: pointer;
    text-align: center;
    letter-spacing: 0.01em;
  }
  .btn.primary {
    background: linear-gradient(180deg, #332310 0%, #1b1308 100%);
    border-color: var(--amber-dim);
    color: var(--amber);
    font-weight: 600;
    box-shadow: 0 0 14px rgba(232,181,71,0.12);
  }
  .btn.ghost {
    color: var(--ink-dim);
    font-size: 13px;
    background: transparent;
    border-color: transparent;
    padding: 10px 8px;
  }
  .btn[disabled] { opacity: 0.4; cursor: not-allowed; }

  /* ledger pane */
  .ledger-pane {
    position: fixed;
    inset: 0;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(5, 3, 1, 0.65);
    z-index: 20;
    opacity: 0;
    transition: opacity 240ms ease;
  }
  .ledger-pane.open { display: flex; opacity: 1; }
  .ledger-card {
    width: 100%;
    max-width: 440px;
    background: var(--bg-card);
    border-top: 1px solid var(--line);
    border-radius: 2px 2px 0 0;
    padding: 26px 22px max(26px, env(safe-area-inset-bottom));
    transform: translateY(24px);
    opacity: 0;
    transition: transform 320ms cubic-bezier(0.2, 0.7, 0.3, 1), opacity 320ms ease;
    position: relative;
  }
  .ledger-pane.open .ledger-card { transform: translateY(0); opacity: 1; }
  .ledger-card::before {
    /* torn / taped top edge */
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 42px; height: 10px;
    background: rgba(200, 150, 70, 0.1);
    border: 1px solid rgba(200, 150, 70, 0.12);
    border-top: none;
  }
  .ledger-title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink-dim);
    margin: 0 0 14px;
    letter-spacing: 0.05em;
    text-align: center;
  }
  .ledger-rows {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-bottom: 16px;
  }
  .ledger-row { display: flex; justify-content: space-between; }
  .ledger-row .k { color: var(--ink-dim); }
  .ledger-row .v { color: var(--ink); letter-spacing: 0.04em; }
  .ledger-row .v.pending { color: var(--amber); }
  .ledger-row .v.zero { color: var(--rust); }
  .ledger-confession {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 13.5px;
    color: var(--rust);
    line-height: 1.45;
    padding: 12px 0 2px;
    border-top: 1px solid #1a130b;
  }
  .ledger-close {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: transparent;
    border: none;
    color: var(--ink-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .modal, .modal-overlay, .ledger-pane, .ledger-card,
    .toggle-handle, .status-sub {
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <div class="back-link"><a href="../../index.html">← cue sheet</a></div>

  <main class="stage" id="stage">
    <div class="status-card" id="statusCard">
      <div class="status-label">front of house</div>
      <div class="status-line" id="statusLine">signed in</div>
      <div class="status-sub" id="statusSub"></div>
    </div>

    <div class="toggle-wrap">
      <div class="toggle-hint" id="toggleHint">drag ← to sign out</div>
      <div class="toggle" id="toggle">
        <div class="toggle-track">
          <span class="toggle-end-label" id="labelLeft">sign out</span>
          <span class="toggle-end-label active" id="labelRight">signed in</span>
        </div>
        <div class="toggle-handle" id="handle"></div>
      </div>
    </div>
  </main>

  <div class="session-tick" id="sessionTick">00:00</div>
  <div class="ledger-mark" id="ledgerMark" title="open the book">●</div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-reasons" id="modalReasons" style="display:none;"></div>
      <div class="modal-buttons" id="modalButtons"></div>
    </div>
  </div>

  <!-- Ledger -->
  <div class="ledger-pane" id="ledgerPane" aria-hidden="true">
    <div class="ledger-card">
      <div class="ledger-title">the book</div>
      <div class="ledger-rows" id="ledgerRows"></div>
      <div class="ledger-confession" id="ledgerConfession"></div>
      <button class="ledger-close" id="ledgerClose">close</button>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const state = {
    sessionStart: performance.now(),
    drags: 0,
    commitsToModal: 0,
    modalsShown: 0,
    signOutButtonsTapped: 0,
    signedOutCount: 0,
    pendingDays: 0,
    round: 0,                 // which sign-out attempt we're on
    modalPhase: 0,            // which step within the current round
    currentReason: null,
    reasonSelected: false,
  };

  const toggle = document.getElementById('toggle');
  const handle = document.getElementById('handle');
  const labelLeft = document.getElementById('labelLeft');
  const labelRight = document.getElementById('labelRight');
  const toggleHint = document.getElementById('toggleHint');
  const statusLine = document.getElementById('statusLine');
  const statusSub = document.getElementById('statusSub');
  const sessionTick = document.getElementById('sessionTick');
  const ledgerMark = document.getElementById('ledgerMark');
  const ledgerPane = document.getElementById('ledgerPane');
  const ledgerClose = document.getElementById('ledgerClose');
  const ledgerRows = document.getElementById('ledgerRows');
  const ledgerConfession = document.getElementById('ledgerConfession');

  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  const modalButtons = document.getElementById('modalButtons');
  const modalReasons = document.getElementById('modalReasons');

  // The confirmation chain. Every round reuses the chain; only the final
  // step reports a different "pending" number so the piece's point stays
  // readable without reshuffling the whole script.
  function buildChain(round) {
    const daysThisRound = 30 + round * 30;
    const chain = [
      {
        title: 'Are you sure you want to sign out?',
        body: 'You’ve been here a while. Your seat is still warm, if you want it.',
        buttons: [
          { text: 'Stay', resolves: 'cancel', style: 'primary' },
          { text: 'Continue sign-out', resolves: 'advance', style: 'ghost' },
        ],
      },
      {
        title: 'Save your draft first?',
        body: 'You haven’t finished what you started tonight. It can wait for you.',
        buttons: [
          { text: 'Save my place', resolves: 'cancel', style: 'primary' },
          { text: 'Leave without saving', resolves: 'advance', style: 'ghost' },
        ],
      },
      {
        title: 'Take a 30-day pause instead?',
        body: 'Pause keeps your preferences warm. We’ll bring the lights back up any time you return.',
        buttons: [
          { text: 'Pause for 30 days', resolves: 'cancel', style: 'primary' },
          { text: 'No, sign out', resolves: 'advance', style: 'ghost' },
        ],
      },
      {
        title: 'Please tell us why you’re leaving.',
        body: 'This helps the house improve. Required.',
        reasons: [
          'I’ll be back soon',
          'Everything is fine, I just need a break',
          'I’ll return after the holidays',
          'I don’t remember signing up',
          'Something else',
        ],
        buttons: [
          { text: 'Submit', resolves: 'advance', style: 'primary', needsReason: true },
        ],
      },
      {
        title: 'Sign-out request accepted.',
        body: 'Deactivation will complete in ' + daysThisRound + ' days. ' +
              'You may cancel at any time by signing back in, which happens automatically if you return to this page.',
        buttons: [
          { text: 'I understand', resolves: 'complete', style: 'primary' },
        ],
        isFinal: true,
        pendingDays: daysThisRound,
      },
    ];
    return chain;
  }

  let currentChain = null;

  // ---------- toggle drag mechanic ----------
  const HANDLE_W = 74;
  const HANDLE_MARGIN = 8;
  let rect = null;
  let maxDrag = 0;
  function measure() {
    rect = toggle.getBoundingClientRect();
    maxDrag = rect.width - HANDLE_W - HANDLE_MARGIN * 2;
  }
  measure();
  window.addEventListener('resize', measure);
  window.addEventListener('orientationchange', measure);

  let dragging = false;
  let startX = 0;
  let startRight = HANDLE_MARGIN;
  let currentRight = HANDLE_MARGIN;
  let pointerId = null;

  const THRESHOLD_FRAC = 0.78;

  function setHandleRight(px) {
    handle.style.right = px + 'px';
    const frac = (px - HANDLE_MARGIN) / Math.max(1, maxDrag);
    // dim the "signed in" label as we drag away from it
    labelRight.style.opacity = String(Math.max(0.3, 1 - frac));
    labelLeft.style.opacity = String(0.3 + 0.7 * frac);
    labelLeft.classList.toggle('active', frac > 0.5);
  }

  function onPointerDown(e) {
    if (dragging) return;
    // ignore if a modal or ledger is open
    if (modalOverlay.classList.contains('open')) return;
    if (ledgerPane.classList.contains('open')) return;
    dragging = true;
    pointerId = e.pointerId;
    handle.setPointerCapture(pointerId);
    handle.classList.remove('returning', 'committed');
    handle.classList.add('dragging');
    startX = e.clientX;
    measure();
    startRight = parseFloat(handle.style.right) || HANDLE_MARGIN;
    currentRight = startRight;
    e.preventDefault();
  }
  function onPointerMove(e) {
    if (!dragging || e.pointerId !== pointerId) return;
    const dx = e.clientX - startX; // negative = toward left
    let next = startRight - dx;    // larger "right" = further left
    next = Math.max(HANDLE_MARGIN, Math.min(HANDLE_MARGIN + maxDrag, next));
    currentRight = next;
    setHandleRight(next);
  }
  function onPointerUp(e) {
    if (!dragging || e.pointerId !== pointerId) return;
    dragging = false;
    handle.releasePointerCapture?.(pointerId);
    handle.classList.remove('dragging');
    state.drags += 1;
    const frac = (currentRight - HANDLE_MARGIN) / Math.max(1, maxDrag);
    if (frac >= THRESHOLD_FRAC) {
      // commit — snap to full-left, then open the confirmation chain
      handle.classList.add('committed');
      setHandleRight(HANDLE_MARGIN + maxDrag);
      state.commitsToModal += 1;
      setTimeout(openChain, 220);
    } else {
      // return — slides back silently (no snark, no counter-reveal)
      handle.classList.add('returning');
      setHandleRight(HANDLE_MARGIN);
    }
    updateTick();
  }
  handle.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  // tapping the toggle handle without dragging should also commit — it's
  // a useful tell that the gesture itself matters less than the fact of
  // the attempt
  let tapStart = 0;
  handle.addEventListener('pointerdown', () => { tapStart = performance.now(); });

  // ---------- modal chain ----------
  function openChain() {
    currentChain = buildChain(state.round);
    state.modalPhase = 0;
    state.currentReason = null;
    state.reasonSelected = false;
    showModal();
  }

  function showModal() {
    const step = currentChain[state.modalPhase];
    if (!step) { closeModal(true); return; }
    state.modalsShown += 1;
    modalTitle.textContent = step.title;
    modalBody.textContent = step.body;

    // reasons
    modalReasons.innerHTML = '';
    if (step.reasons) {
      modalReasons.style.display = 'flex';
      step.reasons.forEach((r, i) => {
        const el = document.createElement('div');
        el.className = 'reason';
        el.innerHTML = '<div class="reason-dot"></div><div>' + r + '</div>';
        el.addEventListener('click', () => {
          state.currentReason = r;
          state.reasonSelected = true;
          [...modalReasons.children].forEach(c => c.classList.remove('selected'));
          el.classList.add('selected');
          renderButtons(step);
        });
        modalReasons.appendChild(el);
      });
    } else {
      modalReasons.style.display = 'none';
    }

    renderButtons(step);
    modalOverlay.classList.add('open');
    modalOverlay.setAttribute('aria-hidden', 'false');
  }

  function renderButtons(step) {
    modalButtons.innerHTML = '';
    step.buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (b.style || '');
      btn.textContent = b.text;
      if (b.needsReason && !state.reasonSelected) btn.setAttribute('disabled', '');
      btn.addEventListener('click', () => handleBtn(b, step));
      modalButtons.appendChild(btn);
    });
  }

  function handleBtn(b, step) {
    state.signOutButtonsTapped += 1;
    if (b.resolves === 'cancel') {
      // "stay" / "pause" / "save" — the piece's quiet trick: every
      // de-escalation choice still closes the modal and returns to the
      // same signed-in state, with no mechanism to actually leave
      closeModal(false);
    } else if (b.resolves === 'advance') {
      if (b.needsReason && !state.reasonSelected) return;
      state.modalPhase += 1;
      showModal();
    } else if (b.resolves === 'complete') {
      // "I understand" — the pending period kicks in
      const finalStep = currentChain[currentChain.length - 1];
      state.pendingDays = finalStep.pendingDays;
      state.round += 1;
      // IMPORTANT: successful "sign-outs" stay at 0. What completed was
      // a request, not the thing itself. The front of house doesn't move.
      closeModal(true);
    }
  }

  function closeModal(wasCompletion) {
    modalOverlay.classList.remove('open');
    modalOverlay.setAttribute('aria-hidden', 'true');
    // reset handle to the right if it wasn't already
    handle.classList.add('returning');
    setHandleRight(HANDLE_MARGIN);
    if (wasCompletion) {
      // status stays "signed in" — only the sub-line admits a pending
      statusSub.textContent = 'deactivation pending · ' + state.pendingDays + ' days';
      statusSub.classList.add('visible');
      toggleHint.textContent = 'try again if you prefer';
    } else {
      // "stay / pause / save" — no change at all
      if (state.pendingDays > 0) {
        // keep showing any prior pending
      }
    }
    updateTick();
  }

  // ---------- ledger ----------
  function openLedger() {
    renderLedger();
    ledgerPane.classList.add('open');
    ledgerPane.setAttribute('aria-hidden', 'false');
  }
  function closeLedger() {
    ledgerPane.classList.remove('open');
    ledgerPane.setAttribute('aria-hidden', 'true');
  }
  ledgerMark.addEventListener('click', openLedger);
  ledgerClose.addEventListener('click', closeLedger);

  function formatSession(ms) {
    const s = Math.floor(ms / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    return mm + ':' + ss;
  }

  function renderLedger() {
    const now = performance.now();
    const session = formatSession(now - state.sessionStart);
    const rows = [
      ['session active', session],
      ['toggle drags', String(state.drags)],
      ['confirmations shown', String(state.modalsShown)],
      ['sign-out buttons tapped', String(state.signOutButtonsTapped)],
      ['sign-outs completed', String(state.signedOutCount), 'zero'],
      ['deactivation pending', state.pendingDays + ' days', state.pendingDays > 0 ? 'pending' : null],
    ];
    ledgerRows.innerHTML = '';
    rows.forEach(([k, v, cls]) => {
      const r = document.createElement('div');
      r.className = 'ledger-row';
      r.innerHTML = '<span class="k">' + k + '</span><span class="v ' + (cls || '') + '">' + v + '</span>';
      ledgerRows.appendChild(r);
    });

    let confession;
    if (state.round === 0) {
      confession = 'Sign-out is a route, not an exit. The clock does not pause for refusal.';
    } else if (state.round === 1) {
      confession = 'One request on file. Nothing has signed out. ' +
                   'The pending window costs you only time — which the house is already counting.';
    } else {
      confession = state.round + ' requests on file. ' +
                   'Each attempt lengthens the pending window; none shorten it. ' +
                   'Refusal is the feature. The exit button was never wired to the door.';
    }
    ledgerConfession.textContent = confession;
  }

  // ---------- session tick ----------
  function updateTick() {
    const ms = performance.now() - state.sessionStart;
    sessionTick.textContent = formatSession(ms);
    if (ledgerPane.classList.contains('open')) renderLedger();
  }
  setInterval(updateTick, 1000);
  updateTick();

  // initialize handle position
  setHandleRight(HANDLE_MARGIN);

})();
</script>
</body>
</html>
