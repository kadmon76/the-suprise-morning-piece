<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blind Follow</title>
<style>
:root{--bg:#0d0d10;--ink:#ece9e2;--dim:#85817a;--amb:#f0b050;--line:#26262b;--red:#d4694a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
body{min-height:100dvh;overflow-x:hidden;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a.back{position:fixed;top:calc(10px + env(safe-area-inset-top));left:16px;color:var(--dim);font:13px/1 system-ui,sans-serif;text-decoration:none;padding:8px 0;z-index:5}
.top{padding:52px 18px 0;max-width:32rem;width:100%;margin:0 auto}
.line{font-size:15px;color:var(--ink);line-height:1.4;min-height:2.8em}
.tally{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;min-height:14px}
.tally i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.tally i.c{background:var(--amb)}
.stage{position:relative;flex:1;min-height:280px;max-width:32rem;width:100%;margin:0 auto;overflow:hidden}
.beam{position:absolute;top:-4px;width:46%;height:86%;opacity:0;transition:opacity .12s;pointer-events:none;
 background:linear-gradient(to bottom,rgba(255,226,170,.55),rgba(255,226,170,.06));clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
.beam.l{left:2%}.beam.r{right:2%}
.beam.on{opacity:1}
.mark{position:absolute;bottom:16%;width:46%;display:flex;justify-content:center}
.mark.l{left:2%}.mark.r{right:2%}
.mark b{display:block;width:46px;height:8px;border-radius:50%;border:1px solid var(--line)}
.fig{position:absolute;bottom:20%;width:22px;height:22px;border-radius:50%;background:#3a3a40;transition:left .25s,background .15s,box-shadow .15s;transform:translateX(-50%);left:50%}
.fig.lit{background:var(--amb);box-shadow:0 0 28px 8px rgba(240,176,80,.55)}
.pads{display:flex;gap:12px;padding:0 18px 18px;max-width:32rem;width:100%;margin:0 auto}
.pads button{flex:1;height:84px;border-radius:14px;border:1px solid var(--line);background:#16161a;color:var(--ink);font:600 15px system-ui;letter-spacing:.14em;text-transform:uppercase}
.pads button:active{background:#1f1f25}
.pads button:disabled{opacity:.45}
.end{display:none;padding:52px 18px 28px;max-width:32rem;width:100%;margin:0 auto}
.end h2{font-size:19px;line-height:1.35;font-weight:600;margin:0 0 18px}
.strip{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin:6px 0}
.strip i{height:22px;border-radius:2px;background:var(--line)}
.strip i.c{background:var(--amb)}
.cap{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:14px}
.end p{font-size:15px;line-height:1.5;color:var(--ink);margin:12px 0}
.end p.d{color:var(--dim)}
.end .big{font-size:18px;color:var(--amb);margin-top:22px}
body.done .top,body.done .stage,body.done .pads{display:none}
body.done .end{display:block}
</style>
</head>
<body>
<a class="back" href="../../index.html">← cue sheet</a>
<div class="top">
  <div class="line" id="line">Stay out of the light.</div>
  <div class="tally" id="tally" aria-hidden="true"></div>
</div>
<div class="stage" id="stage" aria-live="polite">
  <div class="beam l" id="bl"></div><div class="beam r" id="br"></div>
  <div class="mark l"><b></b></div><div class="mark r"><b></b></div>
  <div class="fig" id="fig"></div>
</div>
<div class="pads">
  <button id="pl" aria-label="Step stage left">Left</button>
  <button id="pr" aria-label="Step stage right">Right</button>
</div>
<div class="end" id="end"></div>
<script>
(function(){
const N=40,HALF=20;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const hist=[],caught=[],tallyEl=$('tally');
let busy=false,round=0,ctx={};
for(let i=0;i<N;i++){tallyEl.appendChild(document.createElement('i'))}
const lines=["Stay out of the light.","","","","","","","","","","","","","","","","","","",""];
// predictor: longest-context frequency over the player's own history
function predict(){
  if(hist.length<3)return Math.random()<.5?0:1;
  for(let k=Math.min(4,hist.length-1);k>=1;k--){
    const key=hist.slice(-k).join('');
    const c=ctx[k]&&ctx[k][key];
    if(c&&(c[0]+c[1])>=2&&c[0]!==c[1])return c[0]>c[1]?0:1;
  }
  const z=hist.filter(x=>x===0).length;
  return z===hist.length-z?(Math.random()<.5?0:1):(z>hist.length-z?0:1);
}
function learn(m){
  for(let k=1;k<=4;k++){
    if(hist.length<k)continue;
    const key=hist.slice(-k).join('');
    ctx[k]=ctx[k]||{};ctx[k][key]=ctx[k][key]||[0,0];ctx[k][key][m]++;
  }
}
function step(m){
  if(busy)return;busy=true;
  $('pl').disabled=$('pr').disabled=true;
  // phase 2: it no longer looks at anything
  const guess=round<HALF?predict():(Math.random()<.5?0:1);
  const fig=$('fig');
  fig.style.left=(m===0?25:75)+'%';
  fig.classList.remove('lit');
  const d=reduce?60:520;
  setTimeout(()=>{
    const hit=guess===m;
    (guess===0?$('bl'):$('br')).classList.add('on');
    if(hit)fig.classList.add('lit');
    caught.push(hit);
    tallyEl.children[round].className=hit?'c':'';
    tallyEl.children[round].style.background=hit?'':'#4a4a52';
    $('line').textContent=hit?'Caught.':'Clear.';
    learn(m);hist.push(m);round++;
    setTimeout(()=>{
      $('bl').classList.remove('on');$('br').classList.remove('on');fig.classList.remove('lit');
      if(round>=N){finish();return}
      busy=false;$('pl').disabled=$('pr').disabled=false;
    },reduce?500:760);
  },d);
}
function finish(){
  const a=caught.slice(0,HALF),b=caught.slice(HALF);
  const ca=a.filter(Boolean).length,cb=b.filter(Boolean).length;
  let sw=0;for(let i=HALF+1;i<N;i++)if(hist[i]!==hist[i-1])sw++;
  let after=0,afterN=0;
  for(let i=HALF;i<N-1;i++){if(caught[i]){afterN++;if(hist[i+1]!==hist[i])after++}}
  const strip=arr=>'<div class="strip">'+arr.map(x=>'<i class="'+(x?'c':'')+'"></i>').join('')+'</div>';
  let cmp=cb>ca?'It caught you more often once it stopped trying.':cb===ca?'It caught you exactly as often once it stopped trying.':'It caught you less once it stopped trying, but not by much, and not by anything you did.';
  let h='<h2>Rounds 21 to 40, it was a coin.</h2>'
   +'<div class="cap">1–20 · it read you · caught '+ca+'</div>'+strip(a)
   +'<div class="cap">21–40 · it was not looking · caught '+cb+'</div>'+strip(b)
   +'<p>'+cmp+'</p>'
   +'<p>In that second stretch you changed sides '+sw+' times out of 19'
   +(afterN?', and moved after '+after+' of the '+afterN+' times it caught you':'')
   +'. Each move was a reply to someone who was not asking.</p>'
   +'<p class="d">Some of those you will remember as reading it. A few you will remember as beating it.</p>'
   +'<p class="big">There was nothing to beat.</p>';
  $('end').innerHTML=h;
  document.body.classList.add('done');
}
$('pl').addEventListener('click',()=>step(0));
$('pr').addEventListener('click',()=>step(1));
})();
</script>
</body>
</html>
