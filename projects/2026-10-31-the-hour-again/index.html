<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Hour Again</title>
<style>
:root{--bg:#0b0a0d;--ink:#ece6da;--dim:#7d7882;--amb:#e8a23c;--rule:#26232b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace}
a.back{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;color:var(--dim);font-size:12px;text-decoration:none;z-index:5}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 20px 32px}
#clk{font-size:44px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
#msg{min-height:3em;margin:6px 0 16px;text-align:center;font-size:14px;line-height:1.5;color:var(--dim);max-width:26em}
#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;width:min(92vw,340px)}
#grid button{height:36px;padding:0;border:1px solid var(--rule);border-radius:4px;background:#17151b;color:var(--dim);font:inherit;font-size:10px;touch-action:manipulation}
#grid button.f{border-color:#4a4350}
#grid button.b{background:#3a2a10;border-color:var(--amb);color:var(--amb)}
#grid button.s{background:var(--amb);border-color:var(--amb);color:#1a1206}
#grid button.x{background:transparent;border-color:#1b1920;color:#2b2830}
#grid button.c{border-color:var(--ink);box-shadow:0 0 10px rgba(236,230,218,.5)}
#start{position:fixed;inset:0;background:rgba(11,10,13,.94);display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:1.7;padding:30px;z-index:4;cursor:pointer}
#start small{display:block;color:var(--dim);font-size:12px;margin-top:8px}
#end{display:none;margin-top:22px;max-width:26em;font-size:14px;line-height:1.7;text-align:center}
#end .d{color:var(--dim);font-size:12px;margin-top:10px}
@media (prefers-reduced-motion:reduce){#grid button.c{box-shadow:none}}
</style>
</head>
<body>
<a class="back" href="../../index.html">← cue sheet</a>
<div id="app">
  <div id="clk">01:00</div>
  <div id="msg">The clocks went back. This hour happens twice.</div>
  <div id="grid"></div>
  <div id="end"></div>
</div>
<div id="start" role="button" tabindex="0">The clocks go back tonight. You are handed an hour.<br>Spend it, or don't.<small>tap to begin — it runs a minute a second</small></div>
<script>
(function(){
var G=document.getElementById('grid'),clk=document.getElementById('clk'),msg=document.getElementById('msg'),end=document.getElementById('end'),st=document.getElementById('start');
var T=['reply','scroll','plan','tidy','catch up','check','text back','pay','sort','refresh','prep','look busy','sleep in','optimise','one more','file','book','follow up'];
var cells=[],booked={},start=null,last=-1,done=false,deck=[],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function pad(n){return n<10?'0'+n:''+n}
function next(){if(!deck.length){deck=T.slice();for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=deck[i];deck[i]=deck[j];deck[j]=t}}return deck.pop()}
for(var i=0;i<60;i++)(function(i){var b=document.createElement('button');b.className='f';b.setAttribute('aria-label','minute '+i);
 b.onclick=function(){if(!start||done)return;var m=Math.floor((performance.now()-start)/1000);if(i<=m||booked[i])return;booked[i]=next();b.className='b';b.textContent=booked[i];msg.textContent='01:'+pad(i)+' — '+booked[i]+'.'};
 G.appendChild(b);cells.push(b)})(i);
function begin(){if(start)return;start=performance.now();st.style.display='none';tick()}
st.onclick=begin;st.onkeydown=function(e){if(e.key==='Enter'||e.key===' ')begin()};
function paint(m){for(var i=0;i<60;i++){var c=cells[i],k;
 if(i<m)k=booked[i]?'s':'x';else if(i===m)k='c '+(booked[i]?'s':'f');else k=booked[i]?'b':'f';
 if(c.className!==k)c.className=k}}
function tick(){if(done)return;var m=Math.floor((performance.now()-start)/1000);
 if(m>=60){finish();return}
 if(m!==last){last=m;clk.textContent='01:'+pad(m);paint(m);if(booked[m])msg.textContent='01:'+pad(m)+' — '+booked[m]+'.'}
 setTimeout(tick,100)}
function finish(){done=true;paint(60);clk.textContent='02:00';
 var n=0,cnt={},top='',tc=0;for(var k in booked){n++;cnt[booked[k]]=(cnt[booked[k]]||0)+1}
 for(var w in cnt)if(cnt[w]>tc){tc=cnt[w];top=w}
 var h;
 if(n===0)h='You spent none of it.<br>It ended all the same. An hour kept by not using it is not kept; there is nowhere to keep it.<div class="d">Declining was also a way of using it.</div>';
 else if(n<30)h='You spent '+n+' minutes. The other '+(60-n)+' passed unclaimed.<br>Mostly “'+top+'.” The same things you would have done at any other hour.<div class="d">The extra hour made no extra room. It only made a deadline.</div>';
 else h='You spent '+n+' of 60 minutes.<br>Mostly “'+top+'.” Nothing in it that wasn\'t already waiting for you.<div class="d">A free hour is the one gift you can only receive by turning it into work.</div>';
 msg.textContent='02:00. The same as it would have been.';end.innerHTML=h;end.style.display='block';
 if(!reduce)end.scrollIntoView({behavior:'smooth',block:'end'})}
})();
</script>
</body>
</html>
