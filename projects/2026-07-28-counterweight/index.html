<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Counterweight · The Surprise Morning Piece</title>
<style>
  html,body{margin:0;height:100%;background:#08080b;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  body{font-family:Georgia,'Times New Roman',serif;color:#e9dfce}

  a.back{
    position:fixed;top:14px;left:14px;z-index:9;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:#7c7264;text-decoration:none;
    padding:6px 10px;border:1px solid rgba(233,223,206,.14);border-radius:99px;
    background:rgba(7,7,10,.5);backdrop-filter:blur(4px);
  }
  a.back:hover{color:#e9dfce}

  .prompt{
    position:fixed;top:0;left:0;right:0;z-index:5;
    text-align:center;padding-top:max(58px, env(safe-area-inset-top) + 42px);
    font-style:italic;letter-spacing:.03em;font-size:15px;color:#8a8172;
    pointer-events:none;transition:color .5s ease;
  }
  .prompt.hauling{color:#f0cf9a}
  .prompt.won{color:#cfe9c9}

  .arbor{
    position:fixed;top:14px;right:14px;z-index:9;text-align:right;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;
    line-height:1.65;color:#7c7264;letter-spacing:.02em;
    background:rgba(7,7,10,.4);border:1px solid rgba(233,223,206,.1);
    border-radius:8px;padding:8px 11px;backdrop-filter:blur(4px);
    pointer-events:none;
  }
  .arbor .h{color:#5c5448;text-transform:uppercase;letter-spacing:.16em;font-size:9px;margin-bottom:3px}
  .arbor .v{color:#c9bda3;font-variant-numeric:tabular-nums}

  .rig{position:fixed;inset:0;z-index:1}

  .grid-line{position:absolute;left:8%;right:8%;height:1px;
    background:linear-gradient(90deg, transparent, rgba(233,223,206,.14), transparent);
    pointer-events:none}

  .deck-line{position:absolute;left:0;right:0;height:1px;
    background:linear-gradient(90deg, transparent, rgba(233,223,206,.09), transparent);
    pointer-events:none}

  .rope{position:absolute;left:50%;width:1.5px;background:rgba(200,190,170,.22);
    transform:translateX(-.75px);pointer-events:none}

  .batten{position:absolute;left:50%;width:210px;margin-left:-105px;height:10px;
    border-radius:3px;pointer-events:none;
    background:linear-gradient(180deg, rgba(60,52,40,.9), rgba(20,17,12,.9));
    box-shadow:0 1px 0 rgba(0,0,0,.6);
    transition:box-shadow .3s ease;}

  .lamp{position:absolute;top:-6px;width:22px;height:22px;border-radius:50%;
    transition:background .3s ease, box-shadow .3s ease;
    background:radial-gradient(circle,#3a2c1e 0%,#1c150e 75%);
    box-shadow:0 0 4px 0 rgba(255,140,60,.1);}

  .haul-zone{position:fixed;left:0;right:0;bottom:0;height:44%;z-index:3}

  .anchor{position:absolute;left:50%;width:5px;height:5px;margin-left:-2.5px;
    border-radius:50%;background:rgba(200,190,170,.3);pointer-events:none}

  .center-msg{position:fixed;left:0;right:0;top:44%;z-index:6;text-align:center;
    font-style:italic;font-size:14px;color:#cfe9c9;opacity:0;
    transition:opacity .6s ease;pointer-events:none}
  .center-msg.show{opacity:1}

  @media (prefers-reduced-motion: reduce){
    .lamp,.batten,.prompt,.center-msg{transition:none}
  }
</style>
</head>
<body>
<a class="back" href="../../index.html">← cue sheet</a>
<div class="prompt" id="prompt">slack.</div>

<div class="arbor" id="arbor">
  <div class="h">arbor</div>
  <div><span class="v" id="loadVal">— kg</span></div>
  <div><span class="v" id="beliefVal">— ms</span></div>
  <div><span class="v" id="deltaVal">last Δ —</span></div>
</div>

<div class="rig" id="rig">
  <div class="grid-line" id="gridLine"></div>
  <div class="deck-line" id="deckLine"></div>
  <div class="rope" id="rope"></div>
  <div class="anchor" id="anchor"></div>
  <div class="batten" id="batten">
    <div class="lamp" style="left:8px"></div>
    <div class="lamp" style="left:94px"></div>
    <div class="lamp" style="left:180px"></div>
  </div>
</div>

<div class="center-msg" id="centerMsg">in. hold.</div>
<div class="haul-zone" id="haulZone"></div>

<script>
(function(){
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const TOP_FRAC = 0.20, BOTTOM_FRAC = 0.60, ANCHOR_FRAC = 0.92;
  const GRAVITY = 0.000016;
  const BASE_GAIN = 0.052, GAIN_FLOOR = 0.16;
  const BELIEF_ALPHA = 0.07;

  const promptEl = document.getElementById('prompt');
  const arborEl = document.getElementById('arbor');
  const loadVal = document.getElementById('loadVal');
  const beliefVal = document.getElementById('beliefVal');
  const deltaVal = document.getElementById('deltaVal');
  const gridLine = document.getElementById('gridLine');
  const deckLine = document.getElementById('deckLine');
  const rope = document.getElementById('rope');
  const anchor = document.getElementById('anchor');
  const batten = document.getElementById('batten');
  const lamps = batten.querySelectorAll('.lamp');
  const centerMsg = document.getElementById('centerMsg');
  const haulZone = document.getElementById('haulZone');

  let p = 0.5;
  let avgInterval = 560;
  let lastTapTime = null;
  let lastFrame = null;
  let resolved = false;
  let hauling = false;
  let haulTimeout = null;

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  function layout(){
    const h = window.innerHeight;
    gridLine.style.top = (TOP_FRAC*h - 30) + 'px';
    deckLine.style.top = (BOTTOM_FRAC*h + 40) + 'px';
    anchor.style.top = (ANCHOR_FRAC*h) + 'px';
  }
  window.addEventListener('resize', layout);
  layout();

  function render(){
    const h = window.innerHeight;
    const battenY = BOTTOM_FRAC*h - p*(BOTTOM_FRAC-TOP_FRAC)*h;
    batten.style.top = battenY + 'px';
    const anchorY = ANCHOR_FRAC*h;
    const ropeTop = battenY + 5;
    rope.style.top = ropeTop + 'px';
    rope.style.height = Math.max(0, anchorY - ropeTop) + 'px';

    const warmth = p;
    lamps.forEach(l=>{
      const r = Math.round(58 + warmth*197);
      const g = Math.round(44 + warmth*175);
      const b = Math.round(30 + warmth*110);
      l.style.background = 'radial-gradient(circle, rgb('+r+','+g+','+b+') 0%, rgba('+Math.round(r*.4)+','+Math.round(g*.4)+','+Math.round(b*.4)+',.9) 75%)';
      l.style.boxShadow = '0 0 '+(4+warmth*20)+'px '+(warmth*6)+'px rgba(255,'+Math.round(140+warmth*80)+',60,'+(0.1+warmth*0.55)+')';
    });
  }

  function updateReadout(deltaPct){
    const loadKg = Math.round((1000/avgInterval) * 22);
    loadVal.textContent = loadKg + ' kg';
    beliefVal.textContent = Math.round(avgInterval) + ' ms';
    deltaVal.textContent = 'last Δ ' + (deltaPct === null ? '—' : Math.round(deltaPct*100) + '%');
  }

  function setPrompt(text, cls){
    promptEl.textContent = text;
    promptEl.classList.remove('hauling','won');
    if (cls) promptEl.classList.add(cls);
  }

  function resolveWon(){
    resolved = true;
    setPrompt('in. hold.', 'won');
    centerMsg.classList.add('show');
    setTimeout(()=>{
      centerMsg.classList.remove('show');
      p = 0.5;
      resolved = false;
    }, reduced ? 1100 : 1700);
  }

  function onTap(){
    if (resolved) return;
    const now = performance.now();
    let deltaPct = null;
    if (lastTapTime !== null){
      const thisInterval = now - lastTapTime;
      const surprise = clamp(Math.abs(thisInterval - avgInterval) / avgInterval, 0, 1);
      const gain = BASE_GAIN * (GAIN_FLOOR + (1-GAIN_FLOOR)*surprise);
      p = clamp(p + gain, 0, 1);
      avgInterval = avgInterval*(1-BELIEF_ALPHA) + thisInterval*BELIEF_ALPHA;
      deltaPct = surprise;
    } else {
      p = clamp(p + BASE_GAIN*GAIN_FLOOR, 0, 1);
    }
    lastTapTime = now;
    updateReadout(deltaPct);

    hauling = true;
    setPrompt('hauling.', 'hauling');
    clearTimeout(haulTimeout);
    haulTimeout = setTimeout(()=>{
      hauling = false;
      if (!resolved) setPrompt('slack.');
    }, 380);

    if (p >= 1) resolveWon();
  }

  haulZone.addEventListener('pointerdown', (e)=>{
    if (e.cancelable) e.preventDefault();
    onTap();
  }, {passive:false});

  function tick(ts){
    if (lastFrame === null) lastFrame = ts;
    const dt = ts - lastFrame;
    lastFrame = ts;
    if (!resolved && !hauling){
      p = clamp(p - GRAVITY*dt, 0, 1);
    }
    render();
    requestAnimationFrame(tick);
  }

  document.addEventListener('visibilitychange', ()=>{
    if (!document.hidden) lastFrame = null;
  });

  updateReadout(null);
  render();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
