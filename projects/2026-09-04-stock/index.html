<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock</title>
<style>
  :root{
    color-scheme: dark;
    --bg: #0a0a0c;
    --panel: #131316;
    --panel-line: #232328;
    --ink: #d8d3c4;
    --ink-dim: #85807a;
    --gold: #e3b568;
    --gold-dim: #a68752;
    --blue: #7fb8d6;
    --blue-dim: #4d7d92;
    --rust: #c1704a;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: ui-monospace, "SF Mono", "Courier New", Courier, monospace;
    overflow:hidden; touch-action: manipulation;
  }
  body{
    display:flex; flex-direction:column; height:100dvh; height:100vh;
    padding: max(18px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
  }

  header{ text-align:center; flex: 0 0 auto; margin-bottom: 6px; }
  h1{
    margin:0; font-size: 15px; letter-spacing: 0.22em; font-weight: 600;
    color: var(--ink); text-transform: uppercase;
  }
  .sub{ margin-top:4px; font-size: 11px; color: var(--ink-dim); letter-spacing: 0.05em; }
  .instr{ margin-top: 10px; font-size: 12px; color: var(--ink-dim); letter-spacing: 0.02em; }

  .banner{
    flex: 0 0 auto; text-align:center; overflow:hidden;
    max-height: 0; opacity: 0; margin-top: 0;
  }
  .banner.show{ max-height: 60px; opacity: 1; margin-top: 10px; }
  @media (prefers-reduced-motion:no-preference){
    .banner{ transition: max-height .5s ease, opacity .6s ease, margin-top .5s ease; }
  }
  .banner-inner{
    display:inline-block; padding: 7px 14px; border: 1px solid var(--blue-dim);
    border-radius: 4px; background: rgba(127,184,214,0.06);
    font-size: 10.5px; letter-spacing: 0.14em; color: var(--blue); text-transform: uppercase;
  }

  .stage{ flex: 1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }

  .grid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap: 9px;
    width: 100%; max-width: 360px;
  }

  .tile{
    position:relative; aspect-ratio: 1 / 1; border-radius: 8px;
    border: 1px solid var(--panel-line); background: var(--panel);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 6px 4px; overflow:hidden;
  }
  .tile .name{ font-size: 10.5px; letter-spacing: 0.09em; color: var(--ink); font-weight: 600; }
  .tile .meta{ margin-top: 5px; font-size: 9.5px; color: var(--ink-dim); letter-spacing: 0.03em; }
  .tile.priced{ border-color: var(--blue-dim); }
  .tile.priced .meta{ color: var(--blue); }
  .tile.gone{ background: transparent; border-style: dashed; border-color: var(--panel-line); }
  .tile.gone .name{ display:none; }
  .tile.gone .gone-label{ font-size: 9.5px; color: var(--ink-dim); letter-spacing: 0.05em; }
  .tile .dot{ width:5px; height:5px; border-radius:50%; margin-top:6px; background: var(--gold); opacity:0.7; }
  .tile.gone.paid .dot{ background: var(--blue); }
  .tile .bar{
    position:absolute; left:0; bottom:0; height: 3px; width: 0%;
    background: var(--blue); opacity: 0.8;
  }
  @media (prefers-reduced-motion:no-preference){
    .tile{ transition: border-color .2s ease, background .3s ease; }
  }

  .status{
    flex: 0 0 auto; text-align:center; font-size: 10px; letter-spacing: 0.1em;
    color: var(--ink-dim); text-transform: uppercase; margin-top: 12px;
  }

  footer{
    flex: 0 0 auto; display:flex; justify-content:space-between; align-items:center;
    margin-top: 10px; font-size: 11px;
  }
  footer a{ color: var(--ink-dim); text-decoration:none; letter-spacing: 0.03em; }
  footer a:active{ color: var(--ink); }
  #ledgerBtn{
    background:none; border:none; color: var(--ink-dim); font-family: inherit;
    font-size: 11px; letter-spacing: 0.03em; padding: 8px 2px; cursor:pointer;
  }

  .overlay{
    position: fixed; inset:0; background: rgba(5,5,6,0.94);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  @media (prefers-reduced-motion:no-preference){
    .overlay{ transition: opacity .18s ease; }
  }
  .sheet{
    width:100%; max-width: 460px; background: var(--panel); border-top: 1px solid var(--panel-line);
    border-radius: 10px 10px 0 0; padding: 20px 20px max(20px, env(safe-area-inset-bottom));
    font-size: 12.5px; line-height: 1.75;
  }
  .sheet h2{
    margin: 0 0 12px; font-size: 12px; letter-spacing: 0.16em; color: var(--ink-dim);
    text-transform: uppercase; font-weight: 600;
  }
  .sheet .line{ display:flex; justify-content:space-between; color: var(--ink); }
  .sheet .line b{ color: var(--gold); font-weight:600; }
  .sheet .note{ margin-top: 14px; color: var(--ink-dim); font-size: 12px; line-height: 1.6; }
  .sheet .close{
    margin-top: 18px; width:100%; padding: 11px; background: none;
    border: 1px solid var(--panel-line); border-radius: 6px; color: var(--ink-dim);
    font-family: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  }
</style>
</head>
<body>

<header>
  <h1>Stock</h1>
  <div class="sub">prop shelf, backstage</div>
  <div class="instr">Take whatever you need.</div>
</header>

<div class="banner" id="banner"><div class="banner-inner">House Stock — New Management</div></div>

<div class="stage">
  <div class="grid" id="grid"></div>
</div>

<div class="status" id="status">9 on the shelf</div>

<footer>
  <a href="../../index.html">← cue sheet</a>
  <button id="ledgerBtn">ledger</button>
</footer>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>Shelf Ledger</h2>
    <div class="line"><span>taken free</span><b id="lgFree">0</b></div>
    <div class="line"><span>taken under management</span><b id="lgPaid">0</b></div>
    <div class="line"><span>total hold spent</span><b id="lgSpent">0.0s</b></div>
    <div class="line"><span>still on the shelf</span><b id="lgLeft">9</b></div>
    <div class="note" id="lgNote"></div>
    <button class="close" id="closeLedger">close</button>
  </div>
</div>

<script>
(function(){
  var FLIP_AFTER = 4;
  var ITEMS = [
    { name: 'LANTERN', nights: 96 },
    { name: 'FAN', nights: 34 },
    { name: 'DAGGER', nights: 12 },
    { name: 'TEACUP', nights: 61 },
    { name: 'BIRDCAGE', nights: 8 },
    { name: 'MASK', nights: 143 },
    { name: 'SCROLL', nights: 3 },
    { name: 'CANDLESTICK', nights: 77 },
    { name: 'LOCKET', nights: 22 }
  ];

  function costMs(nights){ return 200 + nights * 7; }

  var grid = document.getElementById('grid');
  var statusEl = document.getElementById('status');
  var bannerEl = document.getElementById('banner');

  var flipped = false;
  var freeTaken = 0;
  var paidTaken = 0;
  var totalHoldMs = 0;

  var actx = null;
  function tone(freq, dur, gainPeak){
    try{
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var osc = actx.createOscillator();
      var gain = actx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      var t0 = actx.currentTime;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(gainPeak, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(actx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch(e){ /* audio unavailable — silent is fine */ }
  }

  ITEMS.forEach(function(item, i){
    item.id = i;
    item.state = 'shelf';
    item.free = null;

    var tile = document.createElement('div');
    tile.className = 'tile';
    tile.setAttribute('data-id', i);
    tile.setAttribute('role', 'button');
    tile.setAttribute('aria-label', item.name.toLowerCase());

    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = item.name;

    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = item.nights + ' nights';

    var goneLabel = document.createElement('div');
    goneLabel.className = 'gone-label';
    goneLabel.textContent = '— gone —';
    goneLabel.style.display = 'none';

    var dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.display = 'none';

    var bar = document.createElement('div');
    bar.className = 'bar';

    tile.appendChild(name);
    tile.appendChild(meta);
    tile.appendChild(goneLabel);
    tile.appendChild(dot);
    tile.appendChild(bar);
    grid.appendChild(tile);

    item.el = tile;
    item.nameEl = name;
    item.metaEl = meta;
    item.goneEl = goneLabel;
    item.dotEl = dot;
    item.barEl = bar;

    var holding = null; // { raf }

    function clearHold(){
      if (holding && holding.raf) cancelAnimationFrame(holding.raf);
      holding = null;
      item.barEl.style.width = '0%';
    }

    function startHold(){
      if (item.state !== 'shelf' || !flipped) return;
      var t0 = performance.now();
      var need = costMs(item.nights);
      holding = {};
      function step(){
        if (!holding) return;
        var elapsed = performance.now() - t0;
        var pct = Math.min(100, (elapsed / need) * 100);
        item.barEl.style.width = pct + '%';
        if (elapsed >= need){
          holding = null;
          takeItem(item, false);
          return;
        }
        holding.raf = requestAnimationFrame(step);
      }
      holding.raf = requestAnimationFrame(step);
    }

    tile.addEventListener('pointerdown', function(e){
      e.preventDefault();
      if (item.state !== 'shelf') return;
      if (!flipped){
        takeItem(item, true);
      } else {
        startHold();
      }
    });
    tile.addEventListener('pointerup', clearHold);
    tile.addEventListener('pointerleave', clearHold);
    tile.addEventListener('pointercancel', clearHold);
  });

  function takeItem(item, free){
    if (item.state !== 'shelf') return;
    item.state = 'gone';
    item.free = free;
    item.nameEl.style.display = 'none';
    item.metaEl.style.display = 'none';
    item.goneEl.style.display = 'block';
    item.dotEl.style.display = 'block';
    item.barEl.style.width = '0%';
    item.el.classList.add('gone');
    if (free){
      freeTaken++;
      tone(760, 0.06, 0.035);
    } else {
      item.el.classList.add('paid');
      paidTaken++;
      totalHoldMs += costMs(item.nights);
      tone(420, 0.09, 0.04);
    }
    updateStatus();
    if (free && freeTaken === FLIP_AFTER && !flipped){
      triggerFlip();
    }
  }

  function triggerFlip(){
    flipped = true;
    bannerEl.classList.add('show');
    ITEMS.forEach(function(item){
      if (item.state !== 'shelf') return;
      item.el.classList.add('priced');
      item.metaEl.textContent = 'hold ' + (costMs(item.nights) / 1000).toFixed(1) + 's';
    });
    tone(1100, 0.05, 0.03);
    setTimeout(function(){ tone(600, 0.14, 0.03); }, 140);
  }

  function updateStatus(){
    var left = ITEMS.length - freeTaken - paidTaken;
    if (left === 0){
      statusEl.textContent = '— shelf empty —';
    } else if (!flipped){
      statusEl.textContent = freeTaken + ' taken free · ' + left + ' on the shelf';
    } else {
      statusEl.textContent = (freeTaken + paidTaken) + ' taken · ' + left + ' on the shelf';
    }
  }

  document.getElementById('ledgerBtn').addEventListener('click', function(){
    document.getElementById('lgFree').textContent = freeTaken;
    document.getElementById('lgPaid').textContent = paidTaken;
    document.getElementById('lgSpent').textContent = (totalHoldMs / 1000).toFixed(1) + 's';
    document.getElementById('lgLeft').textContent = ITEMS.length - freeTaken - paidTaken;
    document.getElementById('lgNote').textContent =
      'Nine items were already here. Each carries the number of nights this shelf has sent it out before tonight. ' +
      'The first four you take are free, the way they always have been. After that, taking one costs a hold — ' +
      'as long as its number says. Nothing you already took gets charged again. Nothing on the shelf changed hands ' +
      'to make that true.';
    document.getElementById('overlay').classList.add('show');
  });
  document.getElementById('closeLedger').addEventListener('click', function(){
    document.getElementById('overlay').classList.remove('show');
  });
  document.getElementById('overlay').addEventListener('click', function(e){
    if (e.target.id === 'overlay') e.currentTarget.classList.remove('show');
  });

  updateStatus();
})();
</script>

</body>
</html>
